<style>
  :root {
    --bg: #f7f8fa; --fg: #1a1d21; --muted: #6b7280;
    --card-bg: #ffffff; --border: #e4e7eb; --hover-bg: #f1f3f5;
    --accent: #0f766e; --accent-bg-soft: #ccfbf1;
    --shadow: 0 1px 2px rgba(0,0,0,.05);
    --green-bg: #dcfce7; --green-fg: #166534;
    --amber-bg: #fef3c7; --amber-fg: #92400e;
    --error-fg: #dc2626;
    /* five-step type scale. Everything in rem so the -apple-system-body
       Dynamic Type hook below still scales the whole page; --text-base is the
       body size and doubles as the iOS-safe (>=16px at default) input size. */
    --text-meta: .75rem;   /* timestamps, counts, store tags, table headers */
    --text-sm: .875rem;    /* secondary lines: brand·category, sub-labels */
    --text-base: 1rem;     /* body, product names, prices, inputs */
    --text-md: 1.125rem;   /* the heading step between body text and the page title */
    --text-lg: 1.5rem;     /* page title */
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #111418; --fg: #e5e7eb; --muted: #9ca3af;
      --card-bg: #1a1e24; --border: #2a2f37; --hover-bg: #20252c;
      --accent: #2dd4bf; --accent-bg-soft: rgba(45,212,191,.15);
      --shadow: 0 1px 2px rgba(0,0,0,.4);
      --green-bg: rgba(34,197,94,.18); --green-fg: #86efac;
      --amber-bg: rgba(245,158,11,.18); --amber-fg: #fcd34d;
      --error-fg: #f87171;
    }
  }
  * { box-sizing: border-box; }
  /* -apple-system-body is the iOS Safari Dynamic Type hook: it resolves to
     the user's OS text-size setting. Only font-family is overridden below,
     so size/line-height keep tracking Dynamic Type; every other font-size
     in this file is in rem so it scales off the same root value. */
  html { font: -apple-system-body; }
  body {
    font-family: system-ui, -apple-system, "PingFang HK", "Noto Sans TC", sans-serif;
    margin: 0; background: var(--bg); color: var(--fg);
    /* non-Apple browsers drop the -apple-system-body shorthand above, taking its
       line-height with it — without this they fall back to the UA default */
    line-height: 1.5;
  }
  .chip:focus-visible, .item:focus-visible, input:focus-visible, select:focus-visible {
    outline: 2px solid var(--accent); outline-offset: 2px;
  }
  /* text for screen readers only — table captions and the detail-panel loading
     announcement, both of which the sighted layout already conveys visually */
  .sr-only {
    position: absolute; width: 1px; height: 1px; padding: 0; margin: -1px;
    overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; border: 0;
  }
  /* sized in em and stroked in currentColor, so an icon is the same weight and
     colour as the text it sits beside wherever it is dropped in (see ICONS) */
  .icon { width: 1em; height: 1em; flex-shrink: 0; vertical-align: -.125em; }

  /* a flex row, not absolutely-positioned actions over a padded title: the
     buttons reserve their own width, so nothing has to guess a right gutter */
  .app-header {
    display: flex; align-items: flex-start; gap: .5rem;
    background: var(--bg); border-bottom: 1px solid var(--border);
    padding: .75rem 1rem;
  }
  .header-titles { min-width: 0; flex: 1; }
  .app-header h1 { font-size: var(--text-lg); margin: 0 0 .15rem; }
  .header-actions { display: flex; gap: .4rem; flex-shrink: 0; }
  .account-btn { max-width: 110px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .tagline { color: var(--muted); font-size: var(--text-sm); margin: 0 0 .2rem; }
  .meta { color: var(--muted); font-size: var(--text-meta); margin: 0 0 .6rem; }
  .meta .chip { margin-left: .4rem; }
  input[type=search] {
    /* an under-16px input triggers iOS zoom-on-focus; --text-base is 1rem,
       which tracks Dynamic Type and is >=16px at default settings */
    width: 100%; max-width: 420px; padding: .5rem .75rem; font-size: var(--text-base);
    border: 1px solid var(--border); border-radius: 999px;
    background: var(--card-bg); color: var(--fg);
    /* it shares the wrapping filter bar with the pickers, so it shrinks with
       them and only drops to its own row once it would go under 260px */
    flex: 1 1 260px;
  }

  /* one-line badge key under the filter bar, dismissible (opwLegendDismissed) */
  .legend {
    display: flex; align-items: center; flex-wrap: wrap; gap: .2rem .9rem;
    padding: 0 1rem; border-bottom: 1px solid var(--border);
    color: var(--muted); font-size: var(--text-meta);
  }
  .legend[hidden] { display: none; }
  .legend-item { display: inline-flex; align-items: center; gap: .35rem; }
  .legend .cat-clear { margin-left: auto; }

  /* search + filters are the only chrome that sticks — the title block above
     scrolls away. z-index 5 keeps this over the unpositioned page content; the
     menus inside it stack within this element, so .cat-menu's 30 still wins
     locally and the modal overlay (50, position:fixed) still wins globally. */
  .filter-bar {
    position: sticky; top: 0; z-index: 5;
    display: flex; flex-wrap: wrap; align-items: center; gap: .5rem 1rem;
    padding: .5rem 1rem; border-bottom: 1px solid var(--border); background: var(--bg);
  }

  .layout { display: block; padding: 1rem; max-width: 1100px; margin: 0 auto; }

  /* both cards are full-width inside that measure (the chart expands inline under a row and needs the room); products leads, drops sits below it. */
  .below-grid { display: flex; flex-direction: column; gap: 1rem; margin-top: 1rem; }

  .card {
    background: var(--card-bg); border: 1px solid var(--border);
    border-radius: 12px; padding: .75rem; box-shadow: var(--shadow);
  }
  /* section headings, not form labels — dropped the uppercase/letter-spacing
     treatment so "Products" reads as a section at the --text-md heading step */
  .card h2 {
    font-size: var(--text-md); font-weight: 600; color: var(--fg); margin: 0 0 .5rem;
  }

  /* heading + its methodology disclosure button */
  .card-head { display: flex; align-items: center; gap: .1rem; margin: 0 0 .5rem; }
  .card-head h2 { margin: 0; }
  .info-btn {
    display: inline-flex; align-items: center; justify-content: center;
    min-width: 2.75rem; min-height: 2.75rem; border: none; background: none;
    color: var(--muted); font: inherit; cursor: pointer; border-radius: 50%; flex-shrink: 0;
  }
  .info-btn:hover { background: var(--hover-bg); color: var(--fg); }
  .disclosure { color: var(--muted); font-size: var(--text-sm); margin: 0 0 .6rem; max-width: 62ch; }
  .disclosure[hidden] { display: none; }

  .products-head { display: flex; align-items: center; justify-content: space-between; gap: .5rem; flex-wrap: wrap; }
  .products-head h2 { margin: 0; flex-shrink: 0; }
  .sort-control { display: flex; align-items: center; gap: .4rem; margin-bottom: .5rem; min-width: 0; flex: 1 1 auto; justify-content: flex-end; }
  .sort-control label { font-size: var(--text-sm); color: var(--muted); flex-shrink: 0; }
  /* `font: inherit` (needed so form controls don't fall back to the UA font)
     resets font-size too, so these controls sit at --text-base by inheritance —
     an explicit font-size before it would be dead. */
  .sort-control select {
    min-height: 2.75rem; flex: 0 1 auto; min-width: 0; max-width: 100%;
    border: 1px solid var(--border); background: var(--card-bg);
    color: var(--fg); border-radius: 999px; padding: .3rem .7rem;
    font: inherit; cursor: pointer; text-overflow: ellipsis;
  }

  .chips { display: flex; flex-wrap: wrap; gap: .4rem; }
  .chip {
    display: inline-flex; align-items: center; min-height: 2.75rem;
    border: 1px solid var(--border); background: var(--card-bg); color: var(--fg);
    border-radius: 999px; padding: .3rem .9rem; font: inherit; cursor: pointer;
    transition: background-color .15s ease, border-color .15s ease, transform .1s ease;
  }
  .chip[hidden] { display: none; }
  .chip:hover { background: var(--hover-bg); }
  .chip:active { transform: scale(.97); }
  .chip[disabled] { opacity: .55; cursor: default; }
  .chip[disabled]:hover { background: var(--card-bg); }
  .chip .count { color: var(--muted); margin-left: .25rem; font-size: var(--text-meta); }
  .chip.active { background: var(--accent); border-color: var(--accent); color: var(--bg); }
  .chip.active:hover { background: var(--accent); }
  .chip.active .count { color: inherit; opacity: .85; }

  .cat-picker { position: relative; display: inline-flex; align-items: center; gap: .4rem; }
  .cat-label { font-size: var(--text-sm); color: var(--muted); }
  .cat-btn { display: inline-flex; align-items: center; gap: .35rem; }
  .cat-btn.active { background: var(--accent); border-color: var(--accent); color: var(--bg); }
  /* inline-flex so the svg inside it is centred and the rotation below spins
     around the glyph, not around a text baseline */
  .cat-chevron { display: inline-flex; transition: transform .15s ease; }
  .cat-btn[aria-expanded="true"] .cat-chevron { transform: rotate(180deg); }
  .cat-clear {
    display: inline-flex; align-items: center; justify-content: center;
    min-width: 2.75rem; min-height: 2.75rem; border: none; background: none;
    color: var(--muted); font-size: var(--text-lg); line-height: 1; cursor: pointer;
    border-radius: 50%;
  }
  .cat-clear:hover { background: var(--hover-bg); color: var(--fg); }
  .cat-clear[hidden] { display: none; }
  .cat-menu {
    position: absolute; top: calc(100% + 6px); left: 0; z-index: 30;
    min-width: 300px; max-width: 380px; max-height: 360px; overflow-y: auto;
    background: var(--card-bg); border: 1px solid var(--border); border-radius: 12px;
    box-shadow: 0 8px 24px rgba(0,0,0,.12); padding: .25rem;
  }
  .cat-menu[hidden] { display: none; }
  .cat-row {
    display: flex; justify-content: space-between; align-items: center; gap: .5rem;
    min-height: 2.75rem; padding: .45rem .6rem; border-radius: 8px; cursor: pointer; font-size: var(--text-sm);
  }
  .cat-row:hover { background: var(--hover-bg); }
  .cat-row:active { background: var(--hover-bg); }
  /* the back arrow and its label are two flex items, so the row's default
     space-between would fling them to opposite edges */
  .cat-row.cat-back { color: var(--muted); justify-content: flex-start; gap: .35rem; }
  .cat-row .count { color: var(--muted); font-size: var(--text-meta); }
  .cat-row-right { display: flex; align-items: center; gap: .4rem; }
  .cat-path-label {
    color: var(--muted); font-size: var(--text-meta); padding: .1rem .6rem .4rem;
    border-bottom: 1px solid var(--border); margin-bottom: .25rem;
  }

  .store-dot {
    display: inline-block; width: 10px; height: 10px; border-radius: 50%;
    margin-right: .35rem; vertical-align: middle;
  }
  .store-tag { display:inline-flex; align-items:center; gap:.3rem; font-size:var(--text-meta); color:var(--muted); white-space:nowrap; }
  .store-tag .store-dot { width:7px; height:7px; margin-right:0; }
  .stores-row { margin-top:.3rem; display:flex; gap:.6rem; flex-wrap:wrap; }

  .result-count { font-size: var(--text-meta); color: var(--muted); margin: 0 0 .5rem; }
  .empty-state { display: flex; flex-direction: column; align-items: flex-start; gap: .6rem; padding: .5rem 0; }

  .list { display: flex; flex-direction: column; gap: .4rem; }
  .item {
    display: block; width: 100%; min-height: 2.75rem; text-align: left; padding: .6rem .7rem;
    border: 1px solid var(--border); border-radius: 10px; background: var(--card-bg);
    box-shadow: var(--shadow); cursor: pointer; font: inherit; color: var(--fg);
    transition: background-color .15s ease, border-color .15s ease, box-shadow .15s ease, transform .1s ease;
    flex-shrink: 0;
  }
  .item:hover { background: var(--hover-bg); border-color: var(--muted); box-shadow: 0 2px 8px rgba(0,0,0,.08); }
  .item:active { transform: scale(.99); }
  .item.selected { border-color: var(--accent); background: var(--accent-bg-soft); }
  .item-row { display: flex; justify-content: space-between; align-items: flex-start; gap: .5rem; }
  .item-name { font-weight: 500; font-size: var(--text-base); }
  .item-sub { color: var(--muted); font-size: var(--text-sm); margin-top: 1px; }
  .item-price { font-size: var(--text-base); font-weight: 500; white-space: nowrap; text-align: right; }
  /* prices sit in a right-aligned column, so proportional digits make the
     decimal points wander as you scroll — pin them to a fixed advance width */
  .item-price, .item-unit, .item-range, .badge.drop { font-variant-numeric: tabular-nums; }
  .item-unit, .item-range { font-size: var(--text-meta); font-weight: 400; color: var(--muted); margin-top: 1px; }
  .item-arrow { color: var(--muted); font-size: var(--text-sm); align-self: center; }
  .badges { margin-top: .3rem; display: flex; gap: .25rem; flex-wrap: wrap; }

  .item-main { display: flex; align-items: center; gap: .5rem; min-width: 0; flex: 1 1 auto; }
  .thumb {
    display: flex; align-items: center; justify-content: center; flex-shrink: 0;
    width: 40px; height: 40px; border-radius: 8px;
    background: var(--hover-bg); border: 1px solid var(--border); overflow: hidden;
  }
  .thumb img { max-width: 100%; max-height: 100%; object-fit: contain; }
  .thumb.thumb-detail { width: 64px; height: 64px; border-radius: 10px; }

  .drop-item { display: flex; justify-content: space-between; align-items: center; gap: .5rem; }
  .drop-item small { color: var(--muted); }
  .drop-item-main { display: flex; align-items: center; gap: .5rem; min-width: 0; flex: 1 1 auto; }
  .drop-item-text { display: flex; flex-direction: column; min-width: 0; }
  .drop-item-right { display: flex; flex-direction: column; align-items: flex-end; gap: .2rem; flex-shrink: 0; }
  .drop-date { font-size: var(--text-meta); color: var(--muted); white-space: nowrap; }
  .cat-picker-primary .cat-btn { font-weight: 600; }
  .show-more-wrap { margin-top: .6rem; }
  .collapse-btn {
    display: inline-flex; align-items: center; justify-content: center;
    min-width: 2.75rem; min-height: 2.75rem; border: none; background: none;
    color: var(--muted); cursor: pointer; border-radius: 8px; flex-shrink: 0;
  }
  .collapse-btn:hover { background: var(--hover-bg); color: var(--fg); }
  .collapse-btn[aria-expanded="false"] .cat-chevron { transform: rotate(-90deg); }
  #productsCard.collapsed .result-count,
  #productsCard.collapsed #results,
  #productsCard.collapsed #showMoreWrap,
  #productsCard.collapsed .sort-control { display: none; }
  .store-picker .cat-row input[type=checkbox] { pointer-events: none; }

  /* first-paint placeholders: index.json is ~1.1MB and blocks the whole list,
     so reserve rows of roughly the real height to avoid a layout jump. */
  /* min-height, not just the inner blocks: it pins the reserved height to a
     typical .item (name + sub + store tags + badges) regardless of the
     placeholder content, which is what keeps real rows from shifting the page. */
  .skel-row { cursor: default; pointer-events: none; min-height: 5.4rem; }
  .skel { background: var(--hover-bg); border-radius: 6px; animation: skel-pulse 1.4s ease-in-out infinite; }
  .skel-line { height: .7rem; }
  .skel-name { width: 11rem; }
  .skel-sub { width: 7rem; margin-top: .4rem; }
  .skel-tags { width: 9rem; height: .6rem; margin-top: .55rem; }
  .skel-price { width: 5rem; height: .9rem; }
  /* detail-panel placeholders: same block order and the same .chart-wrap height
     as the loaded panel, so mounting the chart can't shove content down (the
     mobile breakpoint drops .detail's min-height to auto) */
  /* heights track their real counterparts: .chip and .th-sort both floor at the
     2.75rem touch target, a table cell is .875rem of text plus 1rem of padding */
  /* the sightings block is the one region that arrives on a second fetch, so it
     is reserved here at roughly two rows' height (border + two text lines) */
  .skel-sighting { height: 3.6rem; border-radius: 10px; margin-bottom: .5rem; }
  .skel-chip { width: 3.5rem; height: 2.75rem; border-radius: 999px; }
  .skel-chart { width: 100%; height: 100%; border-radius: 10px; }
  .skel-th { width: 3.5rem; height: 2.75rem; }
  .skel-cell { width: 4rem; height: 1.25rem; }
  @keyframes skel-pulse { 0%, 100% { opacity: 1; } 50% { opacity: .45; } }

  @media (prefers-reduced-motion: reduce) {
    .item, .chip, .cat-chevron { transition: none; }
    .skel { animation: none; }
  }

  .badge {
    display: inline-block; padding: 1px 8px; border-radius: 999px;
    font-size: var(--text-meta); font-weight: 600; white-space: nowrap;
  }
  .badge.fake { background: var(--amber-bg); color: var(--amber-fg); }
  .badge.drop { background: var(--green-bg); color: var(--green-fg); }

  /* accordion detail region, inserted as a sibling right after the selected .item row */
  .item-detail {
    border: 1px solid var(--accent); border-radius: 10px; background: var(--card-bg);
    padding: .75rem; box-shadow: var(--shadow);
  }

  .detail { min-height: 480px; }
  .detail-head { display: flex; align-items: flex-start; gap: .6rem; }
  .detail h2 { margin: 0 0 .1rem; font-size: var(--text-md); }
  .detail .sub-line { color: var(--muted); font-size: var(--text-sm); margin: 0 0 .75rem; }
  .detail-error {
    color: var(--muted); text-align: center; padding: 3rem 1rem;
  }
  .range-chips { margin: 0 0 .75rem; }
  /* why a range chip is disabled — the product simply has less history */
  .range-note { color: var(--muted); font-size: var(--text-meta); margin: -.4rem 0 .75rem; }
  .range-note[hidden] { display: none; }
  .chart-wrap { height: 380px; position: relative; }

  /* Chart.js draws its legend into the canvas, which can take no focus — so the
     canvas legend is off and these DOM buttons are the real toggles. */
  .series-toggles { margin-top: .5rem; }
  .series-toggle { gap: .4rem; }
  .series-toggle[aria-pressed="false"] { opacity: .5; text-decoration: line-through; }
  /* mirrors the dataset's borderDash so the legend and the line agree for
     users who can't separate the chains by hue */
  .series-swatch { display: inline-block; width: 20px; height: 3px; border-radius: 2px; flex-shrink: 0; }

  table { width: 100%; border-collapse: collapse; font-size: var(--text-sm); margin-top: .75rem; }
  th {
    text-align: left; color: var(--muted); font-weight: 600; font-size: var(--text-meta);
    text-transform: uppercase; letter-spacing: .03em; padding: .4rem .5rem;
    border-bottom: 1px solid var(--border);
  }
  /* a sortable header is a real button so it is keyboard operable; `font: inherit`
     picks up the th's uppercase meta size rather than the UA button font */
  .th-sort {
    display: inline-flex; align-items: center; gap: .25rem; width: 100%;
    min-height: 2.75rem; padding: 0; border: none; background: none;
    color: inherit; font: inherit; cursor: pointer;
  }
  .th-sort:hover { color: var(--fg); }
  th.num .th-sort { justify-content: flex-end; }
  td { padding: .5rem; border-bottom: 1px solid var(--border); }
  tbody tr:hover td { background: var(--hover-bg); }
  th.num, td.num { text-align: right; font-variant-numeric: tabular-nums; }
  td.promo { max-width: 140px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }

  .table-wrap { overflow-x: auto; }

  .savings-callout {
    margin: 0 0 .75rem; padding: .65rem .85rem; border-radius: 10px;
    background: var(--green-bg); color: var(--green-fg); font-size: var(--text-base); font-weight: 600;
  }

  .community-heading {
    font-size: var(--text-meta); text-transform: uppercase; letter-spacing: .04em;
    font-weight: 600; color: var(--muted); margin: 1.25rem 0 .5rem;
  }
  .sightings-list { display: flex; flex-direction: column; gap: .5rem; margin-bottom: .5rem; }
  .sighting-row {
    border: 1px solid var(--border); border-radius: 10px; padding: .5rem .65rem;
    background: var(--card-bg);
  }
  .sighting-row.dimmed { opacity: .55; }
  .sighting-main { display: flex; align-items: baseline; gap: .5rem; flex-wrap: wrap; }
  .sighting-shop { font-weight: 600; font-size: var(--text-base); }
  .sighting-price { font-weight: 700; color: var(--accent); font-size: var(--text-base); }
  .sighting-district { color: var(--muted); font-size: var(--text-sm); }
  .sighting-note { color: var(--muted); font-size: var(--text-sm); margin-top: .2rem; }
  .sighting-foot { display: flex; align-items: center; justify-content: space-between; gap: .5rem; margin-top: .35rem; }
  .sighting-time { color: var(--muted); font-size: var(--text-meta); }
  .sighting-votes { display: flex; align-items: center; gap: .1rem; }
  /* see .sort-control select — `font: inherit` supersedes any font-size here */
  .vote-btn, .report-btn {
    display: inline-flex; align-items: center; justify-content: center;
    min-width: 2.75rem; min-height: 2.75rem; border: none; background: none;
    color: var(--muted); cursor: pointer; border-radius: 50%; font: inherit;
  }
  .vote-btn:hover, .report-btn:hover { background: var(--hover-bg); }
  .vote-btn.active { color: var(--accent); }

  .sf-status[hidden] { display: none; }

  .sighting-meta { display: flex; align-items: center; gap: .4rem; flex-wrap: wrap; }

  .badge.old { background: var(--hover-bg); color: var(--muted); }

// Every value below clears WCAG's 3:1 non-text contrast floor against the LIGHT
// --card-bg (#ffffff); MANNINGS and SASA were darkened from #f57c00/#9e9d24,
// which sat at 2.70:1 and 2.87:1 there.
const STORE_COLORS = {
  PARKNSHOP: '#1976d2', WELLCOME: '#d32f2f', AEON: '#7b1fa2',
  WATSONS: '#00897b', MANNINGS: '#e65100', JASONS: '#388e3c',

};
// Three chains fall under 3:1 against the DARK --bg (#111418) — AEON 2.25:1,
// DCHFOOD 2.43:1, LUNGFUNG 3.15:1 — so dark mode substitutes a lighter tone of
// the same hue. Every other chain already clears 3:1 in both themes.
const STORE_COLORS_DARK = {
  AEON: '#ba68c8', DCHFOOD: '#a1887f', LUNGFUNG: '#f06292',
};
// Hue alone can't separate nine lines — WELLCOME's red and JASONS' green are
// the same line to a colorblind reader — so each chain also owns a dash
// pattern, keyed by code so it is stable across products. First two solid: the
// common one- or two-chain product stays clean.
// ponytail: every pattern is even-length so the CSS swatch below can walk it as
// on/off pairs; an odd-length dash phase-inverts on repeat and would disagree
// with the canvas. Keep new entries even.
const STORE_DASH = {
  PARKNSHOP: [], WELLCOME: [], AEON: [8, 4],
  WATSONS: [2, 3], MANNINGS: [12, 4], JASONS: [8, 4, 2, 4],
  DCHFOOD: [1, 4], LUNGFUNG: [14, 4, 2, 4], SASA: [5, 3, 5, 8],
};
const storeDash = sm => STORE_DASH[sm] || [];
const STORE_ORDER = Object.keys(STORE_COLORS);
// stores = the set of CHECKED (included) supermarkets; all checked by default.
STORE_ORDER.forEach(s => state.stores.add(s));
const isDark = () => matchMedia('(prefers-color-scheme: dark)').matches;
const storeColor = sm => (isDark() && STORE_COLORS_DARK[sm]) || STORE_COLORS[sm] || '#9e9e9e';
const storeTag = sm => `<span class="store-tag"><span class="store-dot" style="background:${storeColor(sm)}"></span>${storeLabel(sm)}</span>`;
const reduceMotion = () => matchMedia('(prefers-reduced-motion: reduce)').matches;

// Repaints a chain's borderDash as a CSS gradient for the legend swatch — close
// enough to read as "the dashed one", not a pixel-perfect replica of the line.
function storeSwatchStyle(sm) {
  const color = storeColor(sm);
  const dash = storeDash(sm);
  if (!dash.length) return `background:${color}`;
  let pos = 0;
  const stops = dash.map((len, i) => {
    const stop = `${i % 2 ? 'transparent' : color} ${pos}px ${pos + len}px`;
    pos += len;
    return stop;
  });
  return `background:repeating-linear-gradient(90deg, ${stops.join(',')})`;
}

// Filters + selected product live in the query string so a link is shareable
// and a refresh keeps its place. Filter changes replaceState (no history spam);
// selecting a product pushState, so Back closes the detail panel.
let restoringURL = false;

function syncURL(push) {
  if (restoringURL) return;
  const p = new URLSearchParams();
  if (state.query) p.set('q', state.query);
  const cat = currentCatPath();
  if (cat.length) p.set('cat', cat.join('>'));
  if (state.stores.size !== STORE_ORDER.length) p.set('stores', [...state.stores].join(','));
  if (state.sort !== 'stores_desc') p.set('sort', state.sort);
  if (state.lang !== 'en') p.set('lang', state.lang);
  if (selectedCode) p.set('p', selectedCode);
  const url = p.toString() ? `?${p}` : location.pathname;
  if (push) history.pushState(null, '', url);
  else history.replaceState(null, '', url);
}

// Applies the query string to `state`. Returns the product code to open, if any.
// Called before the first render and again on popstate.
function readURL() {
  const p = new URLSearchParams(location.search);
  state.query = (p.get('q') || '').trim().toLowerCase();
  const cat = (p.get('cat') || '').split('>').filter(Boolean);
  state.cat1 = cat[0] || null;
  state.cat2 = cat[1] || null;
  state.cat3 = cat[2] || null;
  const stores = p.get('stores');
  if (stores !== null) {
    state.stores = new Set(stores.split(',').filter(s => STORE_ORDER.includes(s)));
  } else {
    state.stores = new Set(STORE_ORDER);
  }
  const sort = p.get('sort');
  state.sort = ['stores_desc', 'price_asc', 'unit_asc'].includes(sort) ? sort : 'stores_desc';
  const lang = p.get('lang');
  if (lang === 'en' || lang === 'tc') state.lang = lang;
  document.getElementById('search').value = p.get('q') || '';
  return p.get('p');
}

// Opens (or closes) the inline detail to match `code`, without touching history.
function applyURLSelection(code) {
  if (code === selectedCode) return;
  removeInlineDetail();
  selectedCode = null;
  selectedSummary = null;
  if (!code) return;
  const prod = PRODUCT_BY_CODE.get(code);
  if (!prod) return;
  selectedCode = code;
  selectedSummary = prod;
  // A shared link can name a product that sorts past the first rendered page.
  // Grow the page window until its row exists rather than falling back to the
  // detached panel: the row carries the star, the store dots and the
  // aria-expanded relationship, and paging is cheap (no chart refetch).
  // Products outside the current filters aren't in filteredList at all — growTo
  // can't reach them, so those still land on the standalone-panel path.
  const i = filteredList.findIndex(p => p.code === code);
  if (i >= 0) growTo(i + 1);
  openInlineDetail(document.querySelector(`#results .item[data-code="${CSS.escape(code)}"]`), prod);
}

async function toggleTrack(code) {
  if (!session) { openAuthModal('login'); return; }
  const wasTracked = watchlist.has(code);
  if (wasTracked) watchlist.delete(code); else watchlist.add(code);
  syncStars(code);
  try {
    const { error } = wasTracked
      ? await sb.from('watchlist').delete().eq('user_id', session.user.id).eq('product_code', code)
      : await sb.from('watchlist').insert({ user_id: session.user.id, product_code: code });
    if (error) throw error;
  } catch {
    if (wasTracked) watchlist.add(code); else watchlist.delete(code);
    syncStars(code);
  }
  if (state.trackerOnly) applyFilters();
}

// Both modals reuse this shell, so the dialog semantics, the labelled heading,
// the × and the focus trap are written once. Tab off either end of the control
// list wraps to the other end, so the keyboard cannot reach the page behind.
// ponytail: the trap lists `button, input` and skips visibility/disabled
// filtering — nothing in either modal is ever hidden or disabled. Add a filter
// the day one of them gains a conditional control.
function showAuthModal(title, bodyHTML) {
  const overlay = document.getElementById('authModal');
  overlay.innerHTML =
    `<div class="card modal-card" role="dialog" aria-modal="true" aria-labelledby="authModalTitle">` +
    `<div class="modal-head"><h2 id="authModalTitle">${title}</h2>` +
    `<button type="button" class="modal-close" id="authClose" aria-label="${t().close}">${icon('x')}</button></div>` +
    bodyHTML + `</div>`;
  overlay.hidden = false;
  document.getElementById('authClose').onclick = closeAuthModal;
  // focus has to land inside the dialog or the trap below never sees a keypress;
  // callers with a better first stop (the email field) override this after.
  document.getElementById('authClose').focus();
  // Tab only; Escape keeps bubbling to the document handler that closes us.
  overlay.onkeydown = e => {
    if (e.key !== 'Tab') return;
    const items = overlay.querySelectorAll('button, input');
    if (!items.length) return;
    const edge = e.shiftKey ? items[0] : items[items.length - 1];
    if (document.activeElement !== edge) return;
    e.preventDefault();
    (e.shiftKey ? items[items.length - 1] : items[0]).focus();
  };
  return overlay;
}

function openAuthModal(mode) {

  // that opened us so closing still hands focus back to something that exists

  const submitLabel = mode === 'signup' ? t().signUp : t().login;
  showAuthModal(submitLabel,
    `<div class="auth-error" id="authError" role="alert" hidden></div>` +
    `<div class="auth-note" id="authNote" hidden>${t().confirmSent}</div>` +
    `<div class="oauth-buttons">` +
    `<button type="button" class="chip oauth-btn" id="oauthGoogle">${t().continueGoogle}</button>` +
    `<button type="button" class="chip oauth-btn oauth-apple" id="oauthApple">${t().continueApple}</button>` +
    `</div>` +
    `<div class="auth-divider"><span>${t().or}</span></div>` +

    `<div class="field">` +
    `<label class="field-label" for="authEmail">${t().email}</label>` +
    `<input type="email" id="authEmail" name="email" autocomplete="email">` +
    `</div>` +
    // the password manager needs to know which of the two it is looking at:
    // "current-password" offers a fill, "new-password" offers to generate/save
    `<div class="field">` +
    `<label class="field-label" for="authPassword">${t().password}</label>` +
    `<div class="pw-wrap">` +
    `<input type="password" id="authPassword" name="password"` +
    ` autocomplete="${mode === 'signup' ? 'new-password' : 'current-password'}"` +
    (mode === 'signup' ? ` aria-describedby="authPwHelp"` : '') + `>` +
    `<button type="button" class="chip pw-toggle" id="authPwToggle" aria-pressed="false">${t().showPassword}</button>` +
    `</div></div>` +
    // signup states the rule up front rather than after a rejected attempt
    (mode === 'signup' ? `<p class="field-help" id="authPwHelp">${t().passwordRules}</p>` : '') +
    `<div class="modal-actions">` +
    `<button type="button" class="chip" id="authSubmit">${submitLabel}</button>` +
    `<button type="button" class="chip" id="authSwitch">${mode === 'signup' ? t().login : t().signUp}</button>` +
    `<button type="button" class="chip" id="authCancel">${t().cancel}</button>` +
    `</div>`);
  document.getElementById('authCancel').onclick = closeAuthModal;
  document.getElementById('authPwToggle').onclick = e => {
    const input = document.getElementById('authPassword');
    const shown = input.type === 'text';
    input.type = shown ? 'password' : 'text';
    e.currentTarget.setAttribute('aria-pressed', String(!shown));
    e.currentTarget.textContent = shown ? t().showPassword : t().hidePassword;
  };
  document.getElementById('authSwitch').onclick = () => openAuthModal(mode === 'signup' ? 'login' : 'signup');
  document.getElementById('authSubmit').onclick = () => submitAuth(mode);
  document.getElementById('oauthGoogle').onclick = () => oauthSignIn('google');
  document.getElementById('oauthApple').onclick = () => oauthSignIn('apple');

}

// Supabase only ever speaks English, so an unmapped error left a Traditional
// Chinese reader staring at "Invalid login credentials". Unrecognised messages
// pass through raw — a wrong-language sentence still beats swallowing it.
// ponytail: this keys off Supabase's message text, which is theirs to reword
// at will. A rename silently drops the case back to the raw string; re-check
// the list whenever the gotrue version moves.
const AUTH_ERRORS = [
  [/invalid login credentials/i, 'errInvalidLogin'],
  [/already registered/i, 'errAlreadyRegistered'],
  [/password should be at least|password is too weak|weak password/i, 'errWeakPassword'],
  [/email not confirmed/i, 'errEmailNotConfirmed'],
];

function authErrorText(message) {
  const hit = AUTH_ERRORS.find(([re]) => re.test(message));
  return hit ? t()[hit[1]] : message;
}

async function oauthSignIn(provider) {
  if (!sb) return;
  const errEl = document.getElementById('authError');
  errEl.hidden = true;
  try {
    const { error } = await sb.auth.signInWithOAuth({
      provider, options: { redirectTo: window.location.origin + window.location.pathname },
    });
    if (error) { errEl.textContent = authErrorText(error.message); errEl.hidden = false; }
  } catch (err) {
    errEl.textContent = err.message || String(err);
    errEl.hidden = false;
  }
}

async function submitAuth(mode) {
  if (!sb) return;
  const email = document.getElementById('authEmail').value.trim();
  const password = document.getElementById('authPassword').value;
  const errEl = document.getElementById('authError');
  errEl.hidden = true;
  const { error } = mode === 'signup'
    ? await sb.auth.signUp({ email, password })
    : await sb.auth.signInWithPassword({ email, password });
  if (error) {
    errEl.textContent = authErrorText(error.message);
    errEl.hidden = false;
    return;
  }
  if (mode === 'signup') {
    document.getElementById('authNote').hidden = false;
  } else {
    closeAuthModal();
  }
}

// --- Community price sightings (Supabase) -----------------------------------
// Read is public (sightings_public view + RLS "select using (true)"), so this
// works for signed-out visitors too. Write actions guard on session.

async function fetchSightings(code) {
  const { data, error } = await sb.from('sightings_public').select('*')
    .eq('product_code', code)
    .order('score', { ascending: false })
    .order('created_at', { ascending: false });
  if (error || !data) return [];
  if (!session || !data.length) return data.map(s => ({ ...s, myVote: 0, myReported: false }));
  const ids = data.map(s => s.id);
  const [{ data: votes }, { data: reports }] = await Promise.all([
    sb.from('sighting_votes').select('sighting_id, vote').eq('user_id', session.user.id).in('sighting_id', ids),
    sb.from('sighting_reports').select('sighting_id').eq('user_id', session.user.id).in('sighting_id', ids),
  ]);
  const myVotes = new Map((votes || []).map(v => [v.sighting_id, v.vote]));
  const myReports = new Set((reports || []).map(r => r.sighting_id));
  return data.map(s => ({ ...s, myVote: myVotes.get(s.id) || 0, myReported: myReports.has(s.id) }));
}

  const { data, error } = await sb.from('sightings')

    .select().single();
  if (error) throw error;
  return data;
}

// A row's headline should answer "where do I buy this", not just "what does it
// cost somewhere" — so lead with the low price AND the chain holding it, and
// demote the across-chains range to a muted second line (dropped entirely when
// every chain agrees, since the range would then just restate the headline).
// p.cheapest is emitted by backfill.py's build_index; a stale local index.json
// predating that field falls back to the old range-only headline.
// The unit price is shown on every row it can be parsed for (it used to appear
// only under the per-unit sort, where it was least surprising and least useful);
// an unparseable size renders nothing rather than a placeholder.
function priceCellHTML(p) {
  const range = p.latest_price_range;
  const cheapest = p.cheapest;
  const lead = cheapest
    ? t().cheapestAt(`$${cheapest[1].toFixed(2)}`, storeLabel(cheapest[0]))
    : priceLabel(range);
  const spread = cheapest && range && range[0] !== range[1];
  const up = unitPriceOf(p);
  return `<div class="item-price"><div>${lead}${starHTML(p.code)}</div>` +
    (spread ? `<div class="item-range">${priceLabel(range)}</div>` : '') +
    (up ? `<div class="item-unit">$${up.value.toFixed(1)}/${up.unit}</div>` : '') +
    `</div>`;
}
