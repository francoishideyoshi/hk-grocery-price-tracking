// Counts distinct category[depth] values among products whose category[0..depth-1]
// matches parentVals — feeds each dependent select with only its valid children.
function catCounts(depth, parentVals) {
  const counts = new Map();
  for (const p of INDEX.products) {
    const cat = catOf(p);
    if (parentVals.some((v, i) => cat[i] !== v)) continue;
    const val = cat[depth];
    if (val) counts.set(val, (counts.get(val) || 0) + 1);
  }
  return counts;
}

// Checks whether product p's category path matches the currently selected
// cat1/cat2/cat3 filters (any unset level matches everything at that level).
// Category values are language-specific (see catOf) — switching language
// resets these filters rather than translating them.
function matchesCat(p) {
  if (!p) return false;
  const cat = catOf(p);
  if (state.cat1 && cat[0] !== state.cat1) return false;
  if (state.cat2 && cat[1] !== state.cat2) return false;
  if (state.cat3 && cat[2] !== state.cat3) return false;
  return true;
}

// --- Search ----------------------------------------------------------------
// Token-based, so "mozzarella cheese" finds "Mozzarella Shredded Cheese".
// Every token must match (strict AND); tokens are ranked prefix > substring >
// one-typo so better matches float to the top of the list. When strict AND
// finds nothing at all, applyFilters retries with looseScore below.

// Lowercased EN+TC name/brand per product, so search keeps working in both
// languages regardless of the active UI language.
// ponytail: coupled to NAMES_TC — the TC half only exists once names_tc.json
// has landed, so loadNamesTC() and setLang() both clear this Map. Any future
// writer of NAMES_TC must clear it too.
const SEARCH_HAYSTACK = new Map();

// --- Synonyms --------------------------------------------------------------
// OPW names things the way the packaging does ("Toilet Roll", "Bath Tissue"),
// which is not what anyone types. Each group is one concept: every phrase in it
// rewrites to the same ~tag on both the query and the product haystack, so the
// token matcher below needs no changes at all.
// ponytail: hand-curated, not a thesaurus — grow it from queries that return
// nothing, don't try to be complete up front.
const CONCEPTS = [
  ['toiletpaper',   ['toilet paper', 'toilet roll', 'toilet tissue', 'bath tissue', 'bathroom tissue', '廁紙', '衛生紙']],
  ['papertowel',    ['kitchen towel', 'kitchen paper', 'paper towel', '廚房紙']],
  ['tissue',        ['facial tissue', 'tissue paper', '紙巾', '面紙']],
  ['detergent',     ['laundry detergent', 'washing powder', 'laundry powder', '洗衣液', '洗衣粉']],
  ['dishsoap',      ['dish soap', 'dishwashing liquid', 'washing up liquid', '洗潔精']],
  ['softener',      ['fabric softener', 'fabric conditioner', '柔順劑']],
  ['softdrink',     ['soft drink', 'fizzy drink', 'soda', '汽水']],
  ['sparkling',     ['sparkling water', 'soda water', '有氣水', '梳打水']],
  ['instantnoodle', ['instant noodle', 'cup noodle', 'pot noodle', '即食麵', '公仔麵', '杯麵']],
  ['clingfilm',     ['cling film', 'cling wrap', 'plastic wrap', '保鮮紙']],
  ['foil',          ['tin foil', 'aluminium foil', 'aluminum foil', '錫紙']],
  ['binbag',        ['bin bag', 'bin liner', 'rubbish bag', 'garbage bag', 'trash bag', '垃圾袋']],
  ['wetwipe',       ['wet wipe', 'baby wipe', 'wet tissue', '濕紙巾']],
  ['sanitarypad',   ['sanitary pad', 'sanitary napkin', 'sanitary towel', '衛生巾']],
  ['diaper',        ['diaper', 'nappy', '尿片', '紙尿褲']],
  ['shrimp',        ['shrimp', 'prawn', '蝦']],
  ['eggplant',      ['eggplant', 'aubergine', '茄子']],
  ['coriander',     ['coriander', 'cilantro', '芫茜', '香菜']],
];

// longest phrase first, so "toilet paper" is consumed before any bare-word group
const CONCEPT_PHRASES = CONCEPTS
  .flatMap(([tag, phrases]) => phrases.map(ph => [ph.toLowerCase(), '~' + tag]))
  .sort((a, b) => b[0].length - a[0].length);

// Product side: APPEND tags and keep the original words, so "toilet" alone
// still hits "Toilet Roll" exactly as it does today.
const conceptTags = text =>
  CONCEPT_PHRASES.filter(([ph]) => text.includes(ph)).map(([, tag]) => tag).join(' ');

// Query side: REPLACE the matched phrase. Keeping "paper" as a required token
// is the whole bug — "Toilet Roll" has no "paper" in it and never will.
// Memoised on the last query: searchScore runs once per product per keystroke.
let expandedFor = null, expandedQ = '';
function expandQuery(q) {
  if (q === expandedFor) return expandedQ;
  let rest = q;
  const tags = new Set();
  for (const [ph, tag] of CONCEPT_PHRASES) {
    if (!rest.includes(ph)) continue;
    rest = rest.split(ph).join(' ');
    tags.add(tag);
  }
  expandedFor = q;
  expandedQ = `${rest} ${[...tags].join(' ')}`.trim();
  return expandedQ;
}

// Cached per product: the EN+TC text plus the ~concept tags it earns, which is
// what lets a query for one phrasing of a concept find every other phrasing.
function searchHaystack(p) {
  let hay = SEARCH_HAYSTACK.get(p.code);
  if (hay === undefined) {
    const tc = tcOf(p.code);
    hay = [p.name, p.brand, tc?.name, tc?.brand].filter(Boolean).join(' ').toLowerCase();
    const tags = conceptTags(hay);
    if (tags) hay += ' ' + tags;
    SEARCH_HAYSTACK.set(p.code, hay);
  }
  return hay;
}

// ponytail: only "distance <= 1" is ever asked, so this is the linear
// two-pointer special case of Levenshtein, not the full matrix — it runs over
// thousands of products per keystroke. Widen to a real (banded) matrix only if
// distance 2 tolerance is ever wanted.
function withinOneEdit(a, b) {
  const la = a.length, lb = b.length;
  if (Math.abs(la - lb) > 1) return false;
  let i = 0, j = 0, edits = 0;
  while (i < la && j < lb) {
    if (a[i] === b[j]) { i++; j++; continue; }
    if (++edits > 1) return false;
    if (la === lb) { i++; j++; }  // substitution
    else if (la > lb) i++;        // extra char in a
    else j++;                     // missing char in a
  }
  return edits + (la - i) + (lb - j) <= 1;
}

const NO_SEARCH_MATCH = -Infinity;
const TIER_PREFIX = 3, TIER_SUBSTRING = 2, TIER_TYPO = 1, TIER_NONE = 0;
const FUZZY_MIN_LEN = 4; // below this, one edit is too much of the token to be a typo
const PHRASE_BONUS = 10; // per token, so a verbatim phrase hit always outranks scattered tokens

const searchTokens = q => q.split(/\s+/).filter(Boolean);

function tokenTier(token, hay, words) {
  if (words.some(w => w.startsWith(token))) return TIER_PREFIX;
  if (hay.includes(token)) return TIER_SUBSTRING;
  if (token.length >= FUZZY_MIN_LEN && words.some(w => withinOneEdit(w, token))) return TIER_TYPO;
  return TIER_NONE;
}

// Ranks p against state.query. Returns NO_SEARCH_MATCH when any token misses,
// 0 when the query is empty (everything ties, so the chosen sort decides).
function searchScore(p) {
  if (!p) return NO_SEARCH_MATCH;
  const q = state.query;
  const tokens = searchTokens(expandQuery(q));
  if (!tokens.length) return 0;
  const hay = searchHaystack(p);
  const words = hay.split(/\s+/);
  let score = 0;
  for (const token of tokens) {
    const tier = tokenTier(token, hay, words);
    if (tier === TIER_NONE) return NO_SEARCH_MATCH;
    score += tier;
  }
  // the RAW query, not the expanded one: a product literally named "toilet
  // paper" must still outrank a "Toilet Roll" that only matched via the tag
  if (hay.includes(q)) score += PHRASE_BONUS * tokens.length;
  return score;
}

// Same tiers, no gate: a token that misses just scores nothing, so only an
// all-miss query is a non-result. Feeds applyFilters' fallback pass.
function looseScore(p) {
  const tokens = searchTokens(expandQuery(state.query));
  if (!tokens.length) return 0;
  const hay = searchHaystack(p);
  const words = hay.split(/\s+/);
  let score = 0;
  for (const token of tokens) score += tokenTier(token, hay, words);
  return score || NO_SEARCH_MATCH;
}

// Shared by the products list and the drops panel.
function matchesSearch(p) {
  return searchScore(p) !== NO_SEARCH_MATCH;
}

// Manual check for the matcher — call __searchSelfCheck() from the browser
// console. Deliberately never called in production.
function __searchSelfCheck() {
  const prevQuery = state.query;
  const scattered = { code: '__sc1', name: 'Mozzarella Shredded Cheese', brand: 'Anchor' };
  const phrase = { code: '__sc2', name: 'Mozzarella Cheese Block', brand: 'Anchor' };
  const tea = { code: '__sc3', name: 'Green Tea Bags', brand: 'Lipton' };
  const roll = { code: '__sc4', name: 'Toilet Roll 10 Rolls', brand: 'Virjoy' };
  const tp = { code: '__sc5', name: 'Toilet Paper 10 Rolls', brand: 'Virjoy' };
  const score = (p, q) => { state.query = q; return searchScore(p); };
  console.assert(score(scattered, 'mozzarella cheese') > NO_SEARCH_MATCH, 'tokens may be non-contiguous');
  console.assert(score(scattered, 'mozarella') > NO_SEARCH_MATCH, 'one-typo token still matches');
  console.assert(score(scattered, 'mozzarella biscuit') === NO_SEARCH_MATCH, 'every token must match');
  console.assert(
    score(phrase, 'mozzarella cheese') > score(scattered, 'mozzarella cheese'),
    'verbatim phrase outranks scattered tokens');
  console.assert(score(tea, 'taa') === NO_SEARCH_MATCH, 'no typo tolerance below 4 chars');
  console.assert(score(roll, 'toilet paper') > NO_SEARCH_MATCH, 'synonym tag bridges paper -> roll');
  console.assert(
    score(roll, 'toilet paper towel') === NO_SEARCH_MATCH,
    'a token left over after expansion still gates');
  console.assert(
    score(tp, 'toilet paper') > score(roll, 'toilet paper'),
    'the literal name outranks the one that only matched via the tag');
  state.query = prevQuery;
  ['__sc1', '__sc2', '__sc3', '__sc4', '__sc5'].forEach(c => SEARCH_HAYSTACK.delete(c));
}

function currentCatPath() {
  return [state.cat1, state.cat2, state.cat3].filter(Boolean);
}

function renderCatBtn() {
  const path = currentCatPath();
  const btn = document.getElementById('catBtn');
  document.getElementById('catBtnText').textContent = path.length ? path.join(' › ') : t().allCategories;
  btn.classList.toggle('active', path.length > 0);
  document.getElementById('catClear').hidden = path.length === 0;
}

function applyCatPath(path) {
  state.cat1 = path[0] || null;
  state.cat2 = path[1] || null;
  state.cat3 = path[2] || null;
  closeCatMenu();
  renderCatBtn();
  applyFilters();
  renderDrops();
}

// Mirrors the .star keydown pattern: menu rows are click-only divs, so
// Enter/Space need an explicit activation handler for keyboard use.
// Pass `checked` (true/false) for a toggle row: the rendered <input type=checkbox>
// is decorative (aria-hidden), so the state has to live on the row itself.
function setRowActivation(el, onActivate, checked) {
  el.setAttribute('role', checked === undefined ? 'menuitem' : 'menuitemcheckbox');
  if (checked !== undefined) el.setAttribute('aria-checked', String(checked));
  el.tabIndex = 0;
  el.onclick = onActivate;
  el.onkeydown = e => {
    if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); onActivate(); }
  };
}

// Rows are divs, so roving focus is manual. Escape is deliberately NOT here —
// one global Escape handler (below) already closes whichever menu is open and
// now restores focus to its trigger, so duplicating it per menu would just
// give two code paths for the same key.
function wireMenuKeys(menu) {
  menu.onkeydown = e => {
    const keys = { ArrowDown: 1, ArrowUp: -1, Home: 0, End: 0 };
    if (!(e.key in keys)) return;
    const rows = [...menu.querySelectorAll('.cat-row')];
    if (!rows.length) return;
    e.preventDefault();
    if (e.key === 'Home') { rows[0].focus(); return; }
    if (e.key === 'End') { rows[rows.length - 1].focus(); return; }
    const i = Math.max(0, rows.indexOf(document.activeElement));
    rows[(i + keys[e.key] + rows.length) % rows.length].focus();
  };
}

const focusFirstRow = menu => menu.querySelector('.cat-row')?.focus();

// Opening a menu moves focus into it, so every close path (Escape, picking a
// row, clicking away) must hand focus back to the trigger — but only while
// focus is still inside the menu, so an outside click that already focused
// something else isn't hijacked. Must be read before the menu is hidden:
// hiding it blurs the focused row.
function closeMenuEl(menu, btn) {
  const hadFocus = menu.contains(document.activeElement);
  menu.hidden = true;
  btn.setAttribute('aria-expanded', 'false');
  if (hadFocus) btn.focus();
}

function renderCatMenu() {
  const menu = document.getElementById('catMenu');
  menu.innerHTML = '';
  const depth = menuPath.length;

  if (depth > 0) {
    const back = document.createElement('div');
    back.className = 'cat-row cat-back';
    back.innerHTML = icon('chevronLeft') + t().back;
    setRowActivation(back, () => { menuPath.pop(); renderCatMenu(); });
    menu.appendChild(back);

    const label = document.createElement('div');
    label.className = 'cat-path-label';
    label.textContent = menuPath.join(' › ');
    menu.appendChild(label);
  }

  const allRow = document.createElement('div');
  allRow.className = 'cat-row';
  allRow.textContent = depth === 0 ? t().allCategories : t().allIn(menuPath[menuPath.length - 1]);
  setRowActivation(allRow, () => applyCatPath(menuPath));
  menu.appendChild(allRow);

  const sorted = [...catCounts(depth, menuPath).entries()].sort((a, b) => b[1] - a[1]);
  for (const [name, count] of sorted) {
    const row = document.createElement('div');
    row.className = 'cat-row';
    const nameSpan = document.createElement('span');
    nameSpan.textContent = name;
    const right = document.createElement('span');
    right.className = 'cat-row-right';
    const countSpan = document.createElement('span');
    countSpan.className = 'count';
    countSpan.textContent = count;
    right.appendChild(countSpan);

    const hasChildren = catCounts(depth + 1, [...menuPath, name]).size > 0;
    if (hasChildren) {
      const arrow = document.createElement('span');
      arrow.innerHTML = icon('chevronRight');
      right.appendChild(arrow);
      setRowActivation(row, () => { menuPath.push(name); renderCatMenu(); });
    } else {
      setRowActivation(row, () => applyCatPath([...menuPath, name]));
    }
    row.appendChild(nameSpan);
    row.appendChild(right);
    menu.appendChild(row);
  }
  // drilling in/out replaces every row, so keyboard focus has to be re-seated
  if (catMenuOpen) focusFirstRow(menu);
}

function openCatMenu() {
  const path = currentCatPath();
  menuPath = path.slice(0, Math.max(0, path.length - 1));
  renderCatMenu();
  const menu = document.getElementById('catMenu');
  menu.hidden = false;
  document.getElementById('catBtn').setAttribute('aria-expanded', 'true');
  catMenuOpen = true;
  wireMenuKeys(menu);
  focusFirstRow(menu);
}

function closeCatMenu() {
  catMenuOpen = false;
  closeMenuEl(document.getElementById('catMenu'), document.getElementById('catBtn'));
}

document.getElementById('catClear').addEventListener('click', e => {
  e.stopPropagation();
  applyCatPath([]);
});

document.getElementById('catBtn').addEventListener('click', e => {
  e.stopPropagation();
  catMenuOpen ? closeCatMenu() : openCatMenu();
});

document.addEventListener('click', e => {
  if (catMenuOpen && !e.composedPath().includes(document.querySelector('.cat-picker'))) closeCatMenu();
});

document.addEventListener('keydown', e => {
  if (e.key !== 'Escape') return;
  // both close paths hand focus back to their trigger (see closeMenuEl)
  if (catMenuOpen) closeCatMenu();
  if (storeMenuOpen) closeStoreMenu();
  if (!document.getElementById('authModal').hidden) closeAuthModal();
});

const hasCJK = s => /[一-鿿]/.test(s);

// The input's own value stays instant; only the expensive part (re-filtering
// thousands of products and rebuilding hundreds of rows) waits for a pause.
let searchTimer = null;
let searchSeq = 0; // a slow names_tc.json must not overwrite a newer query's results
document.getElementById('search').addEventListener('input', e => {
  const q = e.target.value.trim().toLowerCase();
  clearTimeout(searchTimer);
  searchTimer = setTimeout(async () => {
    const seq = ++searchSeq; // claimed here, not in the branch: the next query may not fetch at all
    // Chinese typed into an English UI has nothing to match until the TC names
    // land, so they are fetched on demand rather than by every visitor. This
    // also clears SEARCH_HAYSTACK, so haystacks rebuild with TC names + tags.
    if (hasCJK(q) && !NAMES_TC) {
      document.getElementById('resultCount').textContent = t().loadingLang;
      await loadNamesTC();
      if (seq !== searchSeq) return; // a newer keystroke already took over
    }
    state.query = q;
    applyFilters();
    renderDrops();
  }, 150);
});

// ponytail: back-of-envelope unit-price parser, one regex pass over the
// product name. Handles "330mL", "1.5L", "500g", "1kg", "565 GM",
// "250mL x 6", and count-only sizes ("6's"/"6pcs"/"6包"/"6片"). Known
// ceiling: no ranges ("2-3pcs"), no fractions, no units beyond ml/L/g/kg/
// piece — those fall through to null (sorts last). Upgrade to a real units
// library if the product catalog grows beyond HK grocery/drugstore SKUs.
function parseUnitPrice(name, price) {
  const m = name.match(/(?:(\d+)\s*x\s*)?(\d+(?:\.\d+)?)\s*(mL|ml|ML|L|l|kg|KG|Kg|g|G|GM|gm)\b(?:\s*x\s*(\d+))?/);
  if (m) {
    const [, preMult, size, unitRaw, postMult] = m;
    const n = parseFloat(size) * (parseFloat(preMult || postMult) || 1);
    if (!n) return null;
    const unit = unitRaw.toLowerCase();
    if (unit === 'l') return { value: price / (n * 10), unit: '100ml' };
    if (unit === 'ml') return { value: price / (n / 100), unit: '100ml' };
    if (unit === 'kg') return { value: price / (n * 10), unit: '100g' };
    return { value: price / (n / 100), unit: '100g' };
  }
  const cm = name.match(/(\d+)\s*(?:pcs?|'s|包|片)/i);
  if (cm) {
    const n = parseFloat(cm[1]);
    return n ? { value: price / n, unit: 'piece' } : null;
  }
  return null;
}

function unitPriceOf(p) {
  const price = p.latest_price_range?.[0];
  return price == null ? null : parseUnitPrice(nameOf(p), price);
}

function sortComparator() {
  if (state.sort === 'price_asc') {
    return (a, b) => (a.latest_price_range?.[0] ?? Infinity) - (b.latest_price_range?.[0] ?? Infinity);
  }
  if (state.sort === 'unit_asc') {
    // Group by unit basis first (volume, then weight, then piece, then
    // unparseable last) — comparing raw $/100ml vs $/100g vs $/piece numbers
    // is meaningless since they're different quantities.
    const unitOrder = { '100ml': 0, '100g': 1, piece: 2 };
    return (a, b) => {
      const ua = unitPriceOf(a), ub = unitPriceOf(b);
      const oa = ua ? unitOrder[ua.unit] : 3;
      const ob = ub ? unitOrder[ub.unit] : 3;
      if (oa !== ob) return oa - ob;
      return oa === 3 ? 0 : ua.value - ub.value;
    };
  }
  return (a, b) => b.stores.length - a.stores.length; // stores_desc (default)
}

// With a query, relevance leads and the chosen sort only breaks ties; with an
// empty query the three sort modes are the whole ordering, exactly as before.
// `scores` is passed in by the loose pass, whose rows all score
// NO_SEARCH_MATCH under searchScore and would compare as NaN.
function sortProducts(list, scores) {
  const cmp = sortComparator();
  if (!state.query) return [...list].sort(cmp);
  const s = scores || new Map(list.map(p => [p.code, searchScore(p)]));
  return [...list].sort((a, b) => (s.get(b.code) - s.get(a.code)) || cmp(a, b));
}

function renderSortOptions() {
  const sel = document.getElementById('sortSelect');
  sel.innerHTML =
    `<option value="stores_desc">${t().sortStores}</option>` +
    `<option value="price_asc">${t().sortPrice}</option>` +
    `<option value="unit_asc">${t().sortUnit}</option>`;
  sel.value = state.sort;
}

document.getElementById('sortSelect').addEventListener('change', e => {
  state.sort = e.target.value;
  applyFilters();
});

// ponytail: pagination, not virtualization. Clicking through to several
// thousand rows still leaves that many nodes in the DOM — the win here is that
// a filter/search/sort change only ever builds PAGE_SIZE of them, which is the
// path that runs on every keystroke. Swap in a windowed renderer only if
// profiling shows the accumulated node count actually hurts.
const PAGE_SIZE = 50;
// full filtered+sorted list; the first `renderCount` of it are in the DOM.
let filteredList = [];
let renderCount = 0;

function renderCountLine() {
  document.getElementById('resultCount').textContent =
    t().showing(renderCount.toLocaleString(), filteredList.length.toLocaleString());
}

function renderShowMore() {
  const wrap = document.getElementById('showMoreWrap');
  const remaining = filteredList.length - renderCount;
  if (remaining <= 0) { wrap.innerHTML = ''; return; }
  const next = Math.min(PAGE_SIZE, remaining);
  wrap.innerHTML = `<button type="button" class="chip" id="showMoreBtn">` +
    `${t().showMore(next.toLocaleString(), remaining.toLocaleString())}</button>`;
  document.getElementById('showMoreBtn').onclick = () => growTo(renderCount + PAGE_SIZE);
}

// Appends rows up to `target` in place. Existing rows — and any open inline
// detail sitting between them — are left untouched, so paging never costs a
// chart refetch.
function growTo(target) {
  const want = Math.min(target, filteredList.length);
  if (want <= renderCount) return;
  const el = document.getElementById('results');
  for (const p of filteredList.slice(renderCount, want)) el.appendChild(itemRow(p));
  renderCount = want;
  renderCountLine();
  renderShowMore();
}

function applyFilters() {
  if (!INDEX) return;
  let list = INDEX.products.filter(matchesCat);
  list = list.filter(p => p.stores.some(s => state.stores.has(s)));
  if (state.trackerOnly) {
    list = list.filter(p => watchlist.has(p.code));
  }
  // strict AND first; only when it finds nothing does the at-least-one-token
  // pass run, so a query that matches exactly is never diluted by near misses
  let loose = null;
  if (state.query) {
    const exact = list.filter(matchesSearch);
    if (exact.length) {
      list = exact;
    } else {
      loose = new Map();
      for (const p of list) {
        const s = looseScore(p);
        if (s !== NO_SEARCH_MATCH) loose.set(p.code, s);
      }
      list = list.filter(p => loose.has(p.code));
      if (!list.length) loose = null; // nothing matched either way — plain empty state
    }
  }
  const looseNote = document.getElementById('looseNote');
  looseNote.textContent = loose ? t().looseMatch : '';
  looseNote.hidden = !loose;
  filteredList = sortProducts(list, loose);
  // every filter/search/sort/tracker change routes through here, so this is
  // also where the page window resets to the first page.
  renderCount = Math.min(PAGE_SIZE, filteredList.length);
  // ...except when a product is open: a selection that re-sorted past the first
  // page would otherwise be silently closed by the reopen check below.
  if (selectedCode) {
    const i = filteredList.findIndex(p => p.code === selectedCode);
    if (i >= renderCount) renderCount = i + 1;
  }
  renderResults(filteredList.slice(0, renderCount));
  renderCountLine();
  renderShowMore();
  if (!filteredList.length) renderEmptyState();
  // renderResults above rebuilds #results from scratch, which wipes any inline
  // detail region — reopen it (refetches + re-renders the chart, ponytail:
  // known cost, debounce if rapid filter changes while a chart is open ever
  // shows up in profiling) if selectedCode is still visible, else drop the selection.
  if (selectedCode) {
    const row = document.querySelector(`#results .item[data-code="${CSS.escape(selectedCode)}"]`);
    if (row) openInlineDetail(row, selectedSummary);
    else {
      selectedCode = null;
      selectedSummary = null;
    }
  }
  syncURL(false);
}

// Zero results used to be a dead end (a bare line of text), so the empty state
// carries the one action that always gets the user out.
function renderEmptyState() {
  const el = document.getElementById('results');
  el.innerHTML = `<div class="empty-state">` +
    `<div class="item-sub">${state.trackerOnly ? t().noTracked : t().noneMatch}</div>` +
    `<button type="button" class="chip" id="clearFiltersBtn">${t().clearFilters}</button></div>`;
  document.getElementById('clearFiltersBtn').onclick = clearAllFilters;
}

// Resets every filter, tracker mode included — leaving tracker mode on would
// keep the list empty for a user who just asked for "everything".
function clearAllFilters() {
  clearTimeout(searchTimer); // a queued keystroke would otherwise restore the query
  state.query = '';
  state.cat1 = state.cat2 = state.cat3 = null;
  state.stores = new Set(STORE_ORDER);
  state.trackerOnly = false;
  document.getElementById('search').value = '';
  renderCatBtn();
  renderStoreBtn();
  renderTrackerChip();
  applyFilters();
  renderDrops();
}

// id of the single open detail region — rows point at it via aria-controls, so
// a screen reader can follow the accordion relationship both ways.
const DETAIL_ID = 'itemDetail';

function itemRow(p) {
  // Row is a div (not <button>) because it contains a nested star toggle —
  // a <button> cannot contain other interactive/tabindex descendants.
  const btn = document.createElement('div');
  btn.setAttribute('role', 'button');
  // openInlineDetail is the only writer of "true"; every fresh row starts closed.
  btn.setAttribute('aria-expanded', 'false');
  // without this the row's name is every word inside it — brand, category,
  // price, each store tag and each badge, read out before the control's state
  btn.setAttribute('aria-label', nameOf(p));
  btn.tabIndex = 0;
  btn.className = 'item' + (p.code === selectedCode ? ' selected' : '');
  btn.dataset.code = p.code;
  btn.innerHTML =
    `<div class="item-row"><div class="item-main">${thumbHTML(p.code)}<div><div class="item-name">${nameOf(p)}</div>` +
    `<div class="item-sub">${brandOf(p)} &middot; ${catLabel(catOf(p))}</div></div></div>` +
    priceCellHTML(p) +
    `<span class="item-arrow">${icon('chevronRight')}</span></div>` +
    `<div class="stores-row">${STORE_ORDER.filter(s => p.stores.includes(s)).map(storeTag).join('')}</div>` +
    `<div class="badges">${badgeSpans(p.badges)}</div>`;
  btn.onclick = () => selectProduct(p, btn);
  btn.onkeydown = e => {
    if (e.target !== btn) return; // let the nested star handle its own Enter/Space
    if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); selectProduct(p, btn); }
  };
  return btn;
}

function renderResults(products) {
  const el = document.getElementById('results');
  el.innerHTML = '';
  for (const p of products) el.appendChild(itemRow(p));
}

// Inserts the accordion detail region right after rowEl (or, if rowEl is
// null — e.g. a drops-panel click whose product falls outside the current
// filters — at the top of #results as a standalone panel).
function openInlineDetail(rowEl, summary) {
  const wrap = document.createElement('div');
  wrap.className = 'item-detail';
  wrap.id = DETAIL_ID;
  wrap.setAttribute('role', 'region');
  wrap.setAttribute('aria-label', nameOf(summary));
  wrap.innerHTML = '<div class="detail" id="detail"></div>';
  if (rowEl) {
    rowEl.classList.add('selected');
    rowEl.setAttribute('aria-expanded', 'true');
    rowEl.setAttribute('aria-controls', DETAIL_ID);
    rowEl.after(wrap);
  } else {
    // ponytail: standalone fallback rather than also clearing filters to reveal the row.
    document.getElementById('results').prepend(wrap);
  }
  renderDetail(summary);
  return wrap;
}

function removeInlineDetail() {
  document.getElementById(DETAIL_ID)?.remove();
  document.querySelectorAll('.item.selected').forEach(x => x.classList.remove('selected'));
  document.querySelectorAll('#results .item[aria-expanded="true"]').forEach(x => {
    x.setAttribute('aria-expanded', 'false');
    x.removeAttribute('aria-controls');
  });
}

function selectProduct(p, rowEl) {
  if (selectedCode === p.code) { // already open — collapse it
    removeInlineDetail();
    selectedCode = null;
    selectedSummary = null;
    syncURL(false);
    return;
  }
  removeInlineDetail(); // only one open at a time
  selectedCode = p.code;
  selectedSummary = p;
  // rowEl is null for drops-panel clicks — same deal as applyURLSelection: page
  // the list out far enough to expose the real row when the product is in it.
  if (!rowEl) {
    const i = filteredList.findIndex(x => x.code === p.code);
    if (i >= 0) growTo(i + 1);
  }
  const target = rowEl || document.querySelector(`#results .item[data-code="${CSS.escape(p.code)}"]`);
  const wrap = openInlineDetail(target, p);
  if (window.innerWidth < 880) wrap.scrollIntoView({ behavior: 'smooth' });
  syncURL(true);
}

// Formats a set of per-store values as "-X" when all stores agree, or
// "-min ~ -max" when they differ (values are always positive drop magnitudes).
function dropRangeLabel(vals, fmt) {
  const min = Math.min(...vals), max = Math.max(...vals);
  return min === max ? fmt(min) : `${fmt(min)} ~ ${fmt(max)}`;
}

function renderDrops() {
  const el = document.getElementById('drops');
  el.innerHTML = '';
  const entries = INDEX.drops.filter(d => {
    const p = PRODUCT_BY_CODE.get(d.code);
    if (!matchesCat(p)) return false;
    if (!state.stores.has(d.store)) return false;
    if (state.query && !matchesSearch(p)) return false;
    return true;
  });
  // Same product code can drop in multiple chains — group into one row per
  // product, keeping every store's entry so pct/$ can be shown as ranges.
  const groups = new Map();
  for (const d of entries) {
    if (!groups.has(d.code)) {
      groups.set(d.code, { code: d.code, name: d.name, product: PRODUCT_BY_CODE.get(d.code), entries: [] });
    }
    groups.get(d.code).entries.push(d);
  }
  // When the drop happened: prefer the drop entry's own date, else fall back to
  // the product's last_seen (d.date is added by backfill.py; older index.json
  // that predates it still gets a date via last_seen). Use the most recent
  // date across a product's store entries.
  const dropDate = row => row.entries
    .map(d => d.date || row.product?.last_seen || '')
    .filter(Boolean).sort().pop() || '';
  const rows = [...groups.values()].sort((a, b) => {
    const cmp = dropDate(b).localeCompare(dropDate(a)); // most recent first
    if (cmp) return cmp;
    return Math.max(...b.entries.map(d => d.pct)) - Math.max(...a.entries.map(d => d.pct));
  });
  for (const row of rows.slice(0, 20)) {
    const p = row.product;
    const stores = STORE_ORDER.filter(s => row.entries.some(d => d.store === s));
    const pctLabel = dropRangeLabel(row.entries.map(d => d.pct), v => `-${v.toFixed(0)}%`);
    const decLabel = dropRangeLabel(row.entries.map(d => d.latest), v => `$${v.toFixed(2)}`);
    const date = dropDate(row);
    const btn = document.createElement('button');
    btn.type = 'button';
    btn.className = 'item drop-item';
    btn.innerHTML =
      `<span class="drop-item-main">${thumbHTML(row.code)}<span class="drop-item-text">` +
        `<span class="item-name">${p ? nameOf(p) : row.name}</span>` +
        `<span class="item-sub">${p ? `${brandOf(p)} &middot; ${catLabel(catOf(p))}` : ''}</span>` +
        `<span class="stores-row">${stores.map(storeTag).join('')}</span>` +
      `</span></span>` +
      `<span class="drop-item-right"><span class="badge drop">${pctLabel} ${decLabel}</span>` +
        (date ? `<span class="drop-date">${date}</span>` : '') +
      `</span>`;
    btn.onclick = () => {
      const prod = INDEX.products.find(x => x.code === row.code);
      if (prod) selectProduct(prod, null);
    };
    el.appendChild(btn);
  }
  if (!rows.length) el.innerHTML = `<div class="item-sub">${t().noneMatch}</div>`;
}

function median(nums) {
  const s = [...nums].sort((a, b) => a - b);
  const mid = Math.floor(s.length / 2);
  return s.length % 2 ? s[mid] : (s[mid - 1] + s[mid]) / 2;
}

// Chart.js + its date adapter are ~250KB and only needed once a product is
// opened, so they load on demand instead of blocking first paint. The adapter
// registers itself onto the Chart global, so it must load second.
let chartLibPromise = null;
function loadChartLib() {
  if (chartLibPromise) return chartLibPromise;
  const load = src => new Promise((resolve, reject) => {
    const s = document.createElement('script');
    s.src = src;
    s.onload = resolve;
    s.onerror = () => reject(new Error(`failed to load ${src}`));
    document.head.appendChild(s);
  });
  chartLibPromise = load('https://cdn.jsdelivr.net/npm/chart.js@4')
    .then(() => load('https://cdn.jsdelivr.net/npm/chartjs-adapter-date-fns@3'))
    .catch(err => { chartLibPromise = null; throw err; }); // let a later open retry
  return chartLibPromise;
}

let chart = null;

// The panel is written twice — placeholder, then the real thing once the
// product JSON lands — so the placeholder repeats the loaded panel's block
// order (callout, range chips, chart, legend, table) at the same heights.
// .chart-wrap in particular carries its breakpoint height here too, which is
// what stops the chart mounting from shoving the table down on mobile.
function detailSkeletonHTML() {
  const chip = '<div class="skel skel-chip"></div>';
  const head = '<th><div class="skel skel-line skel-th"></div></th>';
  const cell = '<td><div class="skel skel-line skel-cell"></div></td>';
  // Block order mirrors the loaded panel. The community block sits last because
  // it arrives on a second fetch: appending it below everything already read
  // means the chart and table never move, so the panel settles once. Its two
  // reserved rows keep the panel's own height steady. The savings callout sits
  // above the chart in the loaded panel but gets no reservation here: it renders
  // only when a sighting actually beats the online low, so a permanent empty
  // band on every product would cost more than the occasional shift.
  return `<p class="sr-only">${t().loading}</p>` +
    `<div aria-hidden="true">` +
    `<div class="chips range-chips">${chip.repeat(4)}</div>` +
    `<div class="chart-wrap"><div class="skel skel-chart"></div></div>` +
    `<div class="chips series-toggles">${chip.repeat(3)}</div>` +
    `<div class="table-wrap"><table><thead><tr>${head.repeat(5)}</tr></thead><tbody>` +
    `<tr>${cell.repeat(5)}</tr>`.repeat(4) +
    `</tbody></table></div>` +
    `<div class="skel skel-sighting"></div><div class="skel skel-sighting"></div>` +
    `</div>`;
}

// A canvas is opaque to a screen reader, so the chart container carries a
// one-sentence stand-in. "Current" means each chain's last point, which is the
// same number the table's Latest column shows.
function chartSummaryFacts(entries) {
  const latest = entries.map(([, series]) => series[series.length - 1][1]);
  const dates = entries.flatMap(([, series]) => series.map(pt => pt[0])).sort();
  return {
    stores: entries.length,
    start: dates[0], end: dates[dates.length - 1],
    low: Math.min(...latest), high: Math.max(...latest),
  };
}

function chartSummaryText(entries) {
  if (!entries.length) return '';
  const f = chartSummaryFacts(entries);
  return t().chartSummary(f.stores, f.start, f.end, f.low.toFixed(2), f.high.toFixed(2));
}

// chartRange is global and outlives the product, so a range longer than this
// product's history would silently render blank space. Disable those chips,
// fall back to All for the view, and say why. spanDays === null (nothing
// plotted) leaves every chip alone — there is nothing to explain.
function rangeChipState(spanDays, selected) {
  const enabled = key => spanDays == null || RANGES[key] == null || RANGES[key] <= spanDays;
  return {
    enabled,
    active: enabled(selected) ? selected : 'All',
    note: enabled(selected) ? null : Math.max(1, Math.round(spanDays / 30)),
  };
}

// ponytail: three sortable columns, two of them numeric — no generic sort
// framework. Chain sorts on the translated label so TC orders the way it reads.
function tableComparator(key, dir) {
  const mul = dir === 'asc' ? 1 : -1;
  return (a, b) => mul * (key === 'chain' ? a.label.localeCompare(b.label) : a[key] - b[key]);
}

// Offer and the badge column are deliberately absent: neither has a meaningful
// order, so neither gets a button or aria-sort.
const SORT_COLS = [
  { key: 'chain', label: () => t().thChain, cls: '' },
  { key: 'latest', label: () => t().thLatest, cls: 'num' },
  { key: 'median', label: () => t().thMedian, cls: 'num' },
];

function sortableHeader(col, sort) {
  const on = sort.key === col.key;
  const ariaSort = on ? (sort.dir === 'asc' ? 'ascending' : 'descending') : 'none';
  // the icon carries its own aria-hidden, so no wrapper span is needed
  const arrow = on ? icon(sort.dir === 'asc' ? 'chevronUp' : 'chevronDown') : '';
  return `<th${col.cls ? ` class="${col.cls}"` : ''} aria-sort="${ariaSort}">` +
    `<button type="button" class="th-sort" data-key="${col.key}">${col.label()}${arrow}</button></th>`;
}

async function renderDetail(summary) {
  const el = document.getElementById('detail');
  el.innerHTML = `<div class="detail-head">${thumbHTML(summary.code, 'thumb-detail')}<div><h2>${nameOf(summary)}</h2>` +
    `<p class="sub-line">${brandOf(summary)} &middot; ${catLabel(catOf(summary))}</p></div></div>` +
    detailSkeletonHTML();

  const libReady = loadChartLib();

  let p;
  try {
    p = await fetch(`./products/${summary.code}.json`).then(r => {
      if (!r.ok) throw new Error(`HTTP ${r.status}`);
      return r.json();
    });
  } catch (err) {
    el.innerHTML += `<div class="detail-error">${t().loadFailed(err)}</div>`;
    return;
  }

  // Series are sparse (a point only when price/promo changed). Extend each
  // store's line to the product's last confirmed-seen date with a flat
  // point, so the stepped chart doesn't visually stop at the last change
  // when the price has simply stayed the same since.
  // no "empty set means everything" escape hatch: the list already goes empty
  // when every chain is unchecked, so the chart has to agree with it
  const seriesEntries = Object.entries(p.series).filter(([sm]) => state.stores.has(sm));
  const datasets = seriesEntries.map(([sm, series]) => {
    const points = series.map(pt => ({ x: Date.parse(pt[0]), y: pt[1], offer: pt[2] }));
    const last = series[series.length - 1];
    if (summary.last_seen && last[0] < summary.last_seen) {
      points.push({ x: Date.parse(summary.last_seen), y: last[1], offer: last[2] });
    }
    return {
      label: storeLabel(sm), data: points, stepped: true,
      borderColor: storeColor(sm), borderDash: storeDash(sm), fill: false,
      borderWidth: 2, pointRadius: 0, pointHoverRadius: 4, pointHitRadius: 12,
      pointHoverBackgroundColor: storeColor(sm),
    };
  });

  // empty only when every chain is filtered out — an aria-label="" would leave
  // a role=img with no name, so the role goes too
  const chartSummary = chartSummaryText(seriesEntries);
  el.innerHTML = `<div class="detail-head">${thumbHTML(p.code, 'thumb-detail')}<div><h2>${nameOf(p)}${starHTML(p.code)}</h2>` +
    `<p class="sub-line">${brandOf(p)} &middot; ${catLabel(catOf(p))}</p></div></div>` +
    // the callout is the most valuable sentence on the page, so it sits above
    // the fold even though it fills late: it renders only when a sighting beats
    // the online low, so the shift it causes is rare enough to pay for
    `<div id="savingsCallout"></div>` +
    `<div class="chips range-chips" id="rangeChips"></div>` +
    `<p class="range-note" id="rangeNote" hidden></p>` +
    `<div class="chart-wrap" id="chartWrap"` +
    (chartSummary ? ` role="img" aria-label="${escapeHtml(chartSummary)}"` : '') + `>` +
    `<canvas id="chart"></canvas></div>` +
    `<div class="chips series-toggles" id="seriesToggles" role="group" aria-label="${t().seriesToggles}"></div>` +
    `<div class="table-wrap"><table id="latestTable"></table></div>` +
    // the sightings list fills on a second fetch and can run long, so it appends
    // below everything already read instead of shoving the page down
    `<div id="sightingsSection"></div>`;
  document.title = `${nameOf(p)} — ${t().h1}`;

  // How much history this product actually has, in days — drives which range
  // chips are offered (see rangeChipState).
  const xs = datasets.flatMap(d => d.data.map(pt => pt.x));
  const spanDays = xs.length ? (Math.max(...xs) - Math.min(...xs)) / 864e5 : null;
  const chipState = () => rangeChipState(spanDays, chartRange);

  function rangeWindow() {
    const days = RANGES[chipState().active];
    if (days == null) return { min: undefined, max: undefined };
    const lastX = Math.max(...datasets.flatMap(d => d.data.map(pt => pt.x)));
    return { min: lastX - days * 864e5, max: lastX };
  }

  function renderRangeChips() {
    const st = chipState();
    const box = document.getElementById('rangeChips');
    box.innerHTML = '';
    for (const key of Object.keys(RANGES)) {
      const chip = makeChip(t().rangeLabels[key], null, key === st.active);
      if (st.enabled(key)) {
        chip.onclick = () => {
          chartRange = key;
          const { min, max } = rangeWindow();
          chart.options.scales.x.min = min;
          chart.options.scales.x.max = max;
          chart.update();
          renderRangeChips();
        };
      } else {
        chip.disabled = true;
        chip.setAttribute('aria-disabled', 'true');
      }
      box.appendChild(chip);
    }
    const note = document.getElementById('rangeNote');
    note.textContent = st.note == null ? '' : t().historyNote(st.note);
    note.hidden = st.note == null;
  }

  // Toggle state is per-view: this rebuilds every time a product opens, so the
  // buttons always start pressed (visible) and nothing is persisted.
  function renderSeriesToggles() {
    const box = document.getElementById('seriesToggles');
    box.innerHTML = '';
    seriesEntries.forEach(([sm], i) => {
      const btn = document.createElement('button');
      btn.type = 'button';
      btn.className = 'chip series-toggle';
      btn.setAttribute('aria-pressed', String(chart.isDatasetVisible(i)));
      btn.innerHTML = `<span class="series-swatch" style="${storeSwatchStyle(sm)}" aria-hidden="true"></span>${storeLabel(sm)}`;
      btn.onclick = () => {
        chart.setDatasetVisibility(i, !chart.isDatasetVisible(i));
        chart.update();
        btn.setAttribute('aria-pressed', String(chart.isDatasetVisible(i)));
      };
      box.appendChild(btn);
    });
  }

  // two reasons there may be no chart — the library never arrived, or every
  // chain is filtered out. Both leave the table (empty in the second case) and
  // both must skip the chips and toggles, which dereference `chart`.
  let chartOk = true;
  try {
    await libReady;
  } catch (err) {
    chartOk = false;
    const wrap = document.getElementById('chartWrap');
    // the summary describes a chart that isn't there any more
    wrap.removeAttribute('role');
    wrap.removeAttribute('aria-label');
    wrap.innerHTML = `<div class="detail-error">${t().loadFailed(err.message)}</div>`;
  }
  if (chartOk && !seriesEntries.length) {
    chartOk = false;
    // chartSummary was '' here, so the wrap never got the role/aria-label
    document.getElementById('chartWrap').innerHTML =
      `<div class="detail-error">${t().noStoresSelected}</div>`;
  }

  if (chartOk) {
    // chip handlers dereference chart.options, so the chips only exist when the chart does
    renderRangeChips();

    if (chart) chart.destroy();
    const initWindow = rangeWindow();
    chart = new Chart(document.getElementById('chart'), {
      type: 'line',
      data: { datasets },
      plugins: [crosshair],
      options: {
        parsing: false,
        maintainAspectRatio: false,
        // the stylesheet already honours prefers-reduced-motion; Chart.js
        // animates on its own, so it needs telling separately. Data is drawn
        // in its final position immediately either way.
        animation: reduceMotion() ? false : undefined,
        interaction: { mode: 'index', intersect: false },
        scales: {
          x: {
            type: 'time', time: { tooltipFormat: 'yyyy-MM-dd' },
            min: initWindow.min, max: initWindow.max,
            title: { display: true, text: t().axisDate, color: cssVar('--muted') },
            grid: { display: false }, border: { display: false },
            ticks: { color: cssVar('--muted'), maxRotation: 0, maxTicksLimit: 6 },
          },
          y: {
            beginAtZero: false,
            grid: { color: cssVar('--border') }, border: { display: false },
            ticks: { color: cssVar('--muted'), maxTicksLimit: 5, callback: v => '$' + v },
          },
        },
        plugins: {
          // off, not styled: #seriesToggles below the canvas is the legend now,
          // and two legends showing the same nine chains would just compete.
          legend: { display: false },
          tooltip: {
            backgroundColor: cssVar('--card-bg'), borderColor: cssVar('--border'), borderWidth: 1,
            titleColor: cssVar('--fg'), bodyColor: cssVar('--fg'), padding: 10, cornerRadius: 8,
            usePointStyle: true, boxPadding: 4,
            callbacks: {
              // ponytail: historical Offers/promo text is EN-only source data
              // (see backfill.py) — shown untranslated in TC mode too.
              label: ctx => `${ctx.dataset.label}: $${ctx.parsed.y.toFixed(2)}` +
                (ctx.raw.offer ? ` — ${ctx.raw.offer}` : ''),
            },
          },
        },
      },
    });

    // the toggles read chart.isDatasetVisible, so they only exist with a chart
    renderSeriesToggles();
  }

  const fake = new Set(summary.badges.filter(b => b.startsWith('fake:')).map(b => b.split(':')[1]));
  const tableRows = seriesEntries.map(([sm, series]) => {
    const latest = series[series.length - 1];
    return {
      label: storeLabel(sm), latest: latest[1], median: median(series.map(pt => pt[1])),
      offer: latest[2] || '', fake: fake.has(sm),
    };
  });
  // cheapest latest price first — the same question the list row headline answers
  let tableSort = { key: 'latest', dir: 'asc' };

  function renderTable() {
    const sorted = [...tableRows].sort(tableComparator(tableSort.key, tableSort.dir));
    document.getElementById('latestTable').innerHTML =
      `<caption class="sr-only">${t().tableCaption}</caption>` +
      `<thead><tr>${SORT_COLS.map(col => sortableHeader(col, tableSort)).join('')}` +
      `<th>${t().thOffer}</th><th></th></tr></thead><tbody>` +
      sorted.map(r => {
        const offer = escapeHtml(r.offer);
        const badge = r.fake ? `<span class="badge fake" title="${t().fakeTitle}">${t().badgeFake}</span>` : '';
        return `<tr><td>${r.label}</td><td class="num">$${r.latest.toFixed(2)}</td>` +
          `<td class="num">$${r.median.toFixed(2)}</td>` +
          `<td class="promo" title="${offer}">${offer}</td><td>${badge}</td></tr>`;
      }).join('') +
      `</tbody>`;
    document.querySelectorAll('#latestTable .th-sort').forEach(btn => {
      btn.onclick = () => {
        const key = btn.dataset.key;
        // same column again flips direction; a new column starts ascending
        tableSort = { key, dir: tableSort.key === key && tableSort.dir === 'asc' ? 'desc' : 'asc' };
        renderTable();
        // rebuilding the header drops focus, so put it back on the clicked one
        document.querySelector(`#latestTable .th-sort[data-key="${key}"]`)?.focus();
      };
    });
  }
  renderTable();

  // Sightings fetch after the chart/table are already rendered, so a slow
  // network doesn't hold up the parts of the page users came here for.
  loadSightings(p.code, summary);
}

let sightingsCache = [];
let sightingFormOpen = false;
let reportingId = null; // sighting whose inline "really report?" step is open
// one shared status line for outcomes the user must see: submitted / vote or
// report failed. {text, error} or null.
let sightingsMsg = null;

// "Xd ago" / "today" — day resolution only, no library (spec doesn't need
// hour/minute precision for community sightings).
function relativeTime(iso) {
  const days = Math.floor((Date.now() - Date.parse(iso)) / 864e5);
  return days <= 0 ? t().today : t().daysAgo(days);
}

// report_count>=3 sightings are hidden client-side (see sightings.sql note
// on why that threshold is brigade-abusable). Sort score desc, then newest.
function visibleSightings(list) {
  return list.filter(s => s.report_count < 3)
    .sort((a, b) => b.score - a.score || Date.parse(b.created_at) - Date.parse(a.created_at));
}

function renderSavingsCallout(list, summary) {
  const el = document.getElementById('savingsCallout');
  if (!el) return;
  const onlineLow = summary.latest_price_range?.[0];
  const visible = visibleSightings(list);
  const best = visible.length ? visible.reduce((a, b) => (Number(a.price) < Number(b.price) ? a : b)) : null;
  if (!best || onlineLow == null || Number(best.price) >= onlineLow) { el.innerHTML = ''; return; }
  const pct = Math.round((1 - Number(best.price) / onlineLow) * 100);
  el.innerHTML = `<div class="savings-callout">${t().savingsCallout(Number(best.price).toFixed(2), pct, onlineLow.toFixed(2))}</div>`;
}

// A sighting can carry no district at all (free-typed shop, nothing picked in
// the fallback select), so the span is dropped rather than rendered empty. The
// >60d "old" state is opacity-only in CSS, which says nothing to a screen
// reader — the badge carries that same meaning as text.
function sightingMetaHTML(s, old) {
  return (s.district ? `<span class="sighting-district">${districtLabel(s.district)}</span>` : '') +
    (old ? `<span class="badge old" title="${t().oldSightingTitle}">${t().oldSighting}</span>` : '');
}

const voteLabel = vote => (vote === 1 ? t().upvote : t().downvote);

function voteBtnHTML(s, vote) {
  const on = s.myVote === vote;
  return `<button type="button" class="vote-btn${on ? ' active' : ''}" data-vote="${vote}"` +
    ` aria-pressed="${on}" aria-label="${voteLabel(vote)}">${icon(vote === 1 ? 'chevronUp' : 'chevronDown')}</button>`;
}

// Step two of the report: the flag button only arms this panel, this button posts.
function reportConfirmHTML() {
  return `<div class="report-confirm">` +
    `<p class="report-confirm-title">${t().reportConfirmTitle}</p>` +
    `<p class="field-help">${t().reportConfirmBody}</p>` +
    `<div class="modal-actions">` +
    `<button type="button" class="chip report-yes">${t().report}</button>` +
    `<button type="button" class="chip report-no">${t().close}</button>` +
    `</div></div>`;
}

function sightingRowHTML(s) {
  const old = (Date.now() - Date.parse(s.created_at)) / 864e5 > 60;
  const meta = sightingMetaHTML(s, old);
  const confirming = s.id === reportingId;
  return `<div class="sighting-row${old ? ' dimmed' : ''}" data-id="${s.id}">` +
    `<div class="sighting-main"><span class="sighting-shop">${escapeHtml(s.shop_name)}</span>` +
    `<span class="sighting-price">$${Number(s.price).toFixed(2)}</span>` +
    (meta ? `<span class="sighting-meta">${meta}</span>` : '') + `</div>` +
    (s.note ? `<div class="sighting-note">${escapeHtml(s.note)}</div>` : '') +
    `<div class="sighting-foot"><span class="sighting-time">${relativeTime(s.created_at)}</span>` +
    `<span class="sighting-votes">` +
    voteBtnHTML(s, 1) +
    // a bare number announces as "3" with no context, so the score carries a
    // screen-reader-only name beside the visible digits
    `<span class="vote-score"><span aria-hidden="true">${s.score}</span>` +
    `<span class="sr-only">${t().voteScore(s.score)}</span></span>` +
    voteBtnHTML(s, -1) +
    `<button type="button" class="report-btn${s.myReported ? ' active' : ''}"${s.myReported ? ' disabled' : ''}` +
    ` aria-expanded="${confirming}" aria-label="${t().report}">${icon('flag')}</button>` +
    `</span></div>` +
    (confirming ? reportConfirmHTML() : '') +
    `</div>`;
}

// ponytail: Photon (OSM) geocoder — free, no key, CORS-open. Google Places
// would need a billing account + referrer-restricted key. Swapping providers
// later only means replacing searchPlaces + placeDistrict below.
let sfDistrict = ''; // district of the picked place; '' if the user free-typed
let sfDistrictMissing = false; // a place was picked but carried no district
let sfFallbackDistrict = ''; // what the user chose in the fallback <select>
const HK_BBOX = '113.82,22.15,114.44,22.57';
let sfAcResults = [];
let sfAcTimer = null;
let sfAcSeq = 0;
let sfAcActive = -1; // keyboard-highlighted suggestion, -1 = none
async function searchPlaces(q) {
  try {
    const res = await fetch(`https://photon.komoot.io/api/?q=${encodeURIComponent(q)}&limit=6&bbox=${HK_BBOX}`);
    if (!res.ok) return [];
    const json = await res.json();
    return json.features.map(f => f.properties).filter(p => p.name);
  } catch {
    return [];
  }
}
const placeDistrict = p => DISTRICTS.find(d => (p.district || p.city || '').includes(d)) || '';

// form state lives outside the render because renderSightingsList re-runs on
// every vote/report; it is only cleared when the form itself opens or closes
function resetSightingForm() {
  sfDistrict = '';
  sfDistrictMissing = false;
  sfFallbackDistrict = '';
  sfAcResults = [];
  sfAcActive = -1;
}

// aria-required duplicates the native `required` for AT that reads the ARIA
// tree first; the asterisk is the sighted half of the same message.
const reqMark = () => `<span class="req">*<span class="sr-only">${t().required}</span></span>`;

// the picked place's district wins; otherwise whatever the fallback select holds
const resolveDistrict = (picked, fallback) => picked || fallback || '';

// The geocoder fills the district only when a suggestion is picked. Anything
// else — free typing, or a picked place OSM has no district for — falls back to
// an explicit picker, so a sighting never posts a blank district silently.
function districtFieldHTML() {
  if (sfDistrict) {
    return `<p class="sf-status" id="sfDistrictStatus">${t().districtCaptured(districtLabel(sfDistrict))}</p>`;
  }
  return `<div class="field">` +
    `<label class="field-label" for="sfDistrict">${t().district}</label>` +
    `<p class="field-help" id="sfDistrictHelp">${sfDistrictMissing ? t().districtUnknown : t().districtHelp}</p>` +
    `<select id="sfDistrict" aria-describedby="sfDistrictHelp">` +
    `<option value="">${t().districtPick}</option>` +
    DISTRICTS.map(d => `<option value="${d}"${d === sfFallbackDistrict ? ' selected' : ''}>${districtLabel(d)}</option>`).join('') +
    `</select></div>`;
}

function sightingFormHTML() {
  return `<form class="sighting-form" id="sightingForm">` +
    `<div class="field">` +
    `<label class="field-label" for="sfShop">${t().shopName}${reqMark()}</label>` +
    `<p class="field-help" id="sfShopHelp">${t().shopNameHelp}</p>` +
    `<div class="ac-wrap">` +
    `<input type="text" id="sfShop" placeholder="${t().shopNameEg}" autocomplete="off" required aria-required="true"` +
    ` role="combobox" aria-expanded="false" aria-controls="sfShopAc" aria-autocomplete="list" aria-describedby="sfShopHelp">` +
    `<div class="ac-list" id="sfShopAc" role="listbox" aria-label="${t().shopSuggestions}" hidden></div>` +
    `</div></div>` +
    `<div id="sfDistrictField">${districtFieldHTML()}</div>` +
    `<div class="field">` +
    `<label class="field-label" for="sfPrice">${t().pricePaid}${reqMark()}</label>` +
    `<p class="field-help" id="sfPriceHelp">${t().pricePaidHelp}</p>` +
    // inputmode=decimal so phones open the number pad without type=number's spinners fight
    `<input type="number" id="sfPrice" step="0.01" min="0" inputmode="decimal" required aria-required="true" aria-describedby="sfPriceHelp">` +
    `</div>` +
    `<div class="field">` +
    `<label class="field-label" for="sfNote">${t().noteOptional}</label>` +
    `<input type="text" id="sfNote" placeholder="${t().noteEg}">` +
    `</div>` +
    `<p class="sf-status" id="sfStatus" role="alert" hidden></p>` +
    `<div class="modal-actions">` +
    `<button type="submit" class="chip" id="sfSubmit">${t().submit}</button>` +
    `<button type="button" class="chip" id="sfCancel">${t().cancel}</button>` +
    `</div></form>`;
}

// every handler below rebuilds the section's innerHTML, so focus is restored by
// re-querying the fresh DOM rather than holding a stale element reference
const focusIn = sel => document.getElementById('sightingsSection')?.querySelector(sel)?.focus();

function renderSightingsList(code, summary) {
  const container = document.getElementById('sightingsSection');
  if (!container) return;
  const list = visibleSightings(sightingsCache);
  container.innerHTML =
    `<h3 class="community-heading">${t().communityPrices}</h3>` +
    // role=alert on a node inserted with text already in it still announces,
    // and every re-render that carries a message inserts it fresh
    (sightingsMsg ? `<p class="sf-status${sightingsMsg.error ? ' sf-error' : ''}" role="alert">${sightingsMsg.text}</p>` : '') +
    (list.length
      ? `<div class="sightings-list">${list.map(sightingRowHTML).join('')}</div>`
      : `<div class="item-sub">${t().noSightings}</div>`) +
    `<button type="button" class="chip" id="addSightingBtn">${icon('plus')}${t().addSighting}</button>` +
    (sightingFormOpen ? sightingFormHTML() : '');

  const setMsg = (text, error) => {
    sightingsMsg = text ? { text, error } : null;
    renderSightingsList(code, summary);
  };

  document.getElementById('addSightingBtn').onclick = () => {
    if (!session) { openAuthModal('login'); return; }
    sightingFormOpen = !sightingFormOpen;
    resetSightingForm();
    sightingsMsg = null;
    renderSightingsList(code, summary);
    if (sightingFormOpen) document.getElementById('sfShop')?.focus();
  };

  if (sightingFormOpen) {
    const sfShop = document.getElementById('sfShop');
    const sfShopAc = document.getElementById('sfShopAc');
    const districtField = document.getElementById('sfDistrictField');
    // swaps between the "district captured" line and the fallback picker; only
    // called when the captured value actually changed, so the select a user is
    // mid-way through choosing isn't rebuilt under them
    const bindDistrictSelect = () => {
      const sel = document.getElementById('sfDistrict');
      if (sel) sel.onchange = () => { sfFallbackDistrict = sel.value; };
    };
    const renderDistrictField = () => {
      districtField.innerHTML = districtFieldHTML();
      bindDistrictSelect();
    };
    const setDistrict = (d, missing) => {
      if (d === sfDistrict && missing === sfDistrictMissing) return;
      sfDistrict = d;
      sfDistrictMissing = missing;
      renderDistrictField();
    };
    bindDistrictSelect(); // the markup is already in sightingFormHTML's output
    const hideAc = () => {
      sfShopAc.hidden = true;
      sfShopAc.innerHTML = '';
      sfAcActive = -1;
      sfShop.setAttribute('aria-expanded', 'false');
      sfShop.removeAttribute('aria-activedescendant');
    };
    const pickPlace = i => {
      const p = sfAcResults[i];
      if (!p) return;
      sfShop.value = p.name;
      const d = placeDistrict(p);
      setDistrict(d, !d); // picked a place OSM has no district for -> say so
      hideAc();
    };
    const renderAc = () => {
      sfShopAc.innerHTML = sfAcResults.map((p, i) => {
        const sub = [p.street, p.district].filter(Boolean).join(', ');
        return `<div class="ac-item${i === sfAcActive ? ' active' : ''}" id="sfAcOpt${i}" role="option"` +
          ` aria-selected="${i === sfAcActive}" data-i="${i}">${escapeHtml(p.name)}` +
          (sub ? `<div class="ac-sub">${escapeHtml(sub)}</div>` : '') + `</div>`;
      }).join('');
      const open = sfAcResults.length > 0;
      sfShopAc.hidden = !open;
      sfShop.setAttribute('aria-expanded', String(open));
      if (open && sfAcActive >= 0) {
        sfShop.setAttribute('aria-activedescendant', `sfAcOpt${sfAcActive}`);
        // the list scrolls at 220px, so arrowing past the fold must follow
        sfShopAc.querySelector('.ac-item.active')?.scrollIntoView({ block: 'nearest' });
      } else sfShop.removeAttribute('aria-activedescendant');
      sfShopAc.querySelectorAll('.ac-item').forEach(el => {
        // mousedown, not click: blur fires first on click and would hide the list
        el.onmousedown = () => pickPlace(Number(el.dataset.i));
      });
    };
    sfShop.oninput = () => {
      setDistrict('', false); // typing invalidates whatever place was picked
      clearTimeout(sfAcTimer);
      const q = sfShop.value.trim();
      if (q.length < 2) { hideAc(); return; }
      sfAcTimer = setTimeout(async () => {
        const seq = ++sfAcSeq;
        const results = await searchPlaces(q);
        if (seq !== sfAcSeq) return; // stale response, a newer query already fired
        sfAcResults = results;
        renderAc();
      }, 250);
    };
    sfShop.onblur = hideAc;
    // the suggestion list used to be mouse-only, which trapped a keyboard user
    // in an input whose list they could see but never reach
    sfShop.onkeydown = e => {
      if (e.key === 'Escape') { hideAc(); return; }
      if (sfShopAc.hidden || !sfAcResults.length) return;
      const n = sfAcResults.length;
      if (e.key === 'ArrowDown') {
        e.preventDefault();
        sfAcActive = (sfAcActive + 1) % n;
        renderAc();
      } else if (e.key === 'ArrowUp') {
        e.preventDefault();
        sfAcActive = sfAcActive <= 0 ? n - 1 : sfAcActive - 1;
        renderAc();
      } else if (e.key === 'Enter' && sfAcActive >= 0) {
        e.preventDefault(); // choosing a suggestion must not submit the form
        pickPlace(sfAcActive);
      }
    };
    document.getElementById('sfCancel').onclick = () => {
      sightingFormOpen = false;
      resetSightingForm();
      renderSightingsList(code, summary);
    };
    const sfStatus = document.getElementById('sfStatus');
    const sfSubmit = document.getElementById('sfSubmit');
    const setFormStatus = (text, error) => {
      sfStatus.textContent = text;
      sfStatus.classList.toggle('sf-error', !!error);
      sfStatus.hidden = !text;
    };
    document.getElementById('sightingForm').onsubmit = async e => {
      e.preventDefault();
      if (sfSubmit.disabled) return; // in flight already
      const shop_name = document.getElementById('sfShop').value.trim();
      const price = parseFloat(document.getElementById('sfPrice').value);
      const district = resolveDistrict(sfDistrict, document.getElementById('sfDistrict')?.value || '');
      const note = document.getElementById('sfNote').value.trim();
      if (!shop_name || !(price >= 0)) return;
      sfSubmit.disabled = true; // one tap, one sighting
      setFormStatus(t().submitting, false);
      try {
        await postSighting({ code, shop_name, price, district, note });
        sightingsCache = await fetchSightings(code);
        sightingFormOpen = false;
        resetSightingForm();
        // the form is gone after this render, so the confirmation goes on the list
        sightingsMsg = { text: t().submitted, error: false };
        renderSightingsList(code, summary);
        renderSavingsCallout(sightingsCache, summary);
      } catch {
        // leave the form open with the entered values so the user can retry —
        // but say so, an unchanged form reads as "nothing happened"
        sfSubmit.disabled = false;
        setFormStatus(t().submitFailed, true);
      }
    };
  }

  // ponytail: clicking your own current vote again just resends the same
  // value (idempotent) rather than un-voting — a second click to undo isn't
  // in the spec, add a delete-on-repeat-click if that's needed later.
  container.querySelectorAll('.vote-btn').forEach(btn => {
    btn.onclick = async () => {
      if (!session) { openAuthModal('login'); return; }
      const id = btn.closest('.sighting-row').dataset.id;
      const s = sightingsCache.find(x => x.id === id);
      const vote = parseInt(btn.dataset.vote, 10);
      const prevScore = s.score, prevVote = s.myVote;
      s.score += vote - prevVote;
      s.myVote = vote;
      sightingsMsg = null;
      renderSightingsList(code, summary);
      // the whole list is rebuilt, so a keyboard user would otherwise land back
      // on <body> after voting
      focusIn(`.sighting-row[data-id="${id}"] .vote-btn[data-vote="${vote}"]`);
      try {
        await voteSighting(id, vote);
      } catch {
        // the score silently bouncing back reads as a UI glitch, not a failure
        s.score = prevScore; s.myVote = prevVote;
        setMsg(t().voteFailed, true);
      }
    };
  });

  // first tap only arms the confirm step below the row — reporting cannot be
  // undone and three reports hide the sighting from everyone
  container.querySelectorAll('.report-btn').forEach(btn => {
    btn.onclick = () => {
      if (!session) { openAuthModal('login'); return; }
      const id = btn.closest('.sighting-row').dataset.id;
      reportingId = reportingId === id ? null : id;
      sightingsMsg = null;
      renderSightingsList(code, summary);
      focusIn(reportingId ? `.sighting-row[data-id="${id}"] .report-yes` : `.sighting-row[data-id="${id}"] .report-btn`);
    };
  });

  container.querySelectorAll('.report-no').forEach(btn => {
    btn.onclick = () => {
      const id = btn.closest('.sighting-row').dataset.id;
      reportingId = null;
      renderSightingsList(code, summary);
      focusIn(`.sighting-row[data-id="${id}"] .report-btn`);
    };
  });

  container.querySelectorAll('.report-yes').forEach(btn => {
    btn.onclick = async () => {
      const id = btn.closest('.sighting-row').dataset.id;
      const s = sightingsCache.find(x => x.id === id);
      const prevReported = s.myReported, prevCount = s.report_count;
      s.myReported = true;
      s.report_count += 1;
      reportingId = null;
      sightingsMsg = null;
      renderSightingsList(code, summary);
      renderSavingsCallout(sightingsCache, summary);
      // the confirm button just vanished and the flag button is now disabled,
      // so focus lands on the nearest control still in the same row
      focusIn(`.sighting-row[data-id="${id}"] .vote-btn`);
      try {
        await reportSighting(id);
      } catch {
        s.myReported = prevReported; s.report_count = prevCount;
        setMsg(t().reportFailed, true);
        renderSavingsCallout(sightingsCache, summary);
      }
    };
  });
}

async function loadSightings(code, summary) {
  sightingFormOpen = false;
  reportingId = null;
  sightingsMsg = null;
  resetSightingForm();
  sightingsCache = [];
  if (!AUTH_ENABLED || !sb) { renderSightingsList(code, summary); return; }
  document.getElementById('sightingsSection').innerHTML =
    `<h3 class="community-heading">${t().communityPrices}</h3><div class="item-sub">${t().loading}</div>`;
  sightingsCache = await fetchSightings(code);
  if (selectedCode !== code) return; // user switched products while this was in flight
  renderSavingsCallout(sightingsCache, summary);
  renderSightingsList(code, summary);
}
</script>
</body>
</html>
